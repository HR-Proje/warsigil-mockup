<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Davet Programı ve Promosyon Kodu</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070c18;color:#F4ECD8;font:15px Arial,sans-serif}#stage{position:absolute;width:844px;height:390px;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;background:#0B1224;overflow:hidden}#liste{position:absolute;left:14px;top:7px;color:#A9B4D0;z-index:2}.win{position:absolute;inset:34px 20px 16px;background:#121B33;border:1px solid #C9A04E;border-radius:8px}.head{height:48px;border-bottom:1px solid #59472a;display:flex;align-items:center;padding:0 10px;gap:9px}.title{font:900 17px Georgia,serif;color:#F6D88E}.tab,.pill{min-height:38px;padding:0 14px;border:1px solid #C9A04E;border-radius:999px;background:#1a2742;color:#F4ECD8;font-weight:bold;font-size:13px}.tab.active{color:#F6D88E;background:#3a2f1c}.x{margin-left:auto;width:44px;height:44px;border:0;background:none;color:#F4ECD8;font-size:25px}.pane{display:none;position:absolute;inset:52px 10px 8px}.pane.active{display:block}.points{height:43px;display:flex;align-items:center;gap:10px}.track{height:12px;border:1px solid #C9A04E;border-radius:99px;flex:1}.fill{height:100%;width:3%;background:#C9A04E;border-radius:99px}.muted{color:#A9B4D0;font-size:12px}.grid{display:grid;grid-template-columns:1.6fr .55fr .6fr repeat(5,.7fr) .85fr;grid-template-rows:repeat(4,43px);gap:3px}.cell{border:1px solid #35405a;border-radius:6px;background:#10192e;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;padding:2px}.th{color:#F6D88E;font-weight:800}.friend{justify-content:flex-start;gap:5px}.slot{width:40px;height:38px;flex:none;border:1px dashed #C9A04E;border-radius:6px;display:grid;place-items:center;text-align:center;color:#A9B4D0;font-size:7px;line-height:1.05;overflow-wrap:anywhere}.foot{position:absolute;bottom:0;left:0;right:0;height:40px;display:flex;align-items:center;justify-content:space-between}.primary{background:#116744!important;border-color:#4bb888!important}.promo{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}.visual{height:245px;border:1px dashed #C9A04E;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#A9B4D0}.visual b,.form h2{color:#F6D88E}.form{display:flex;flex-direction:column;gap:10px}.form h2{font:900 19px Georgia,serif;margin:0}input{height:44px;background:#0B1224;border:1px solid #C9A04E;border-radius:7px;color:#F4ECD8;padding:0 10px}.status{color:#F6D88E;min-height:18px;font-size:12px}</style></head><body><main id="stage"><a id="liste" href="../">← Liste</a><section class="win"><header class="head"><b class="title">DAVET PROGRAMI</b><button class="tab active" data-pane="invite">Davet Programı</button><button class="tab" data-pane="promo">Promosyon Kodu</button><button class="x" aria-label="Kapat">×</button></header><section id="invite" class="pane active"><div class="points"><b>Davet Puanı</b><div class="track"><div class="fill"></div></div><span>0 / 25</span><span class="muted">Sv 50 arkadaşların günlük görevleri</span></div><div class="grid" id="grid"></div><footer class="foot"><span class="muted">Grup 1 · Davet edilen arkadaşlar</span><button class="pill primary" id="share">Davet Bağlantısı Al</button></footer></section><section id="promo" class="pane promo"><div class="visual"><b>Görsel gerekli</b><span>hazine-odasi.png · 360×245 px</span></div><form class="form"><h2>ÖDÜLÜNÜ AL</h2><label for="code">Kodlar genelde hesap başına bir kez kullanılır</label><input id="code" aria-label="Promosyon kodu"><button class="pill primary">Onayla</button><div class="status" aria-live="polite"></div></form></section></section></main><script>const stage=document.querySelector('#stage');function fit(){stage.style.setProperty('--s',Math.min(innerWidth/844,innerHeight/390))}addEventListener('resize',fit);fit();const rows=[['Oyuncu','Güven','Seviye','10','20','30','40','50','Bonus'],['Davet Bağlantısı Al','—','—','Paket','Zümrüt','Kitap','Paket','Materyal','Kilitli'],['Davet Bağlantısı Al','—','—','Paket','Zümrüt','Kitap','Paket','Kitap','Kilitli'],['Davet Bağlantısı Al','—','—','Paket','Zümrüt','Kitap','Zümrüt','Kitap','Kilitli']];const grid=document.querySelector('#grid');rows.forEach((row,ri)=>row.forEach((v,ci)=>{const el=document.createElement('div');el.className='cell'+(ri===0?' th':'')+(ri&&ci===0?' friend':'');if(ri&&ci===0){const slot=document.createElement('span');slot.className='slot';slot.innerHTML='G&#246;rsel gerekli<br>oyuncu.png<br>29&#215;29 px';el.append(slot,document.createTextNode(v))}else el.textContent=v;grid.append(el)}));document.querySelectorAll('.tab').forEach(b=>b.addEventListener('pointerup',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id===b.dataset.pane))}));document.querySelector('.x').addEventListener('pointerup',()=>location.href='../ana-ekran/');document.querySelector('#share').addEventListener('pointerup',()=>{document.querySelector('.foot .muted').textContent='Davet bağlantısı hazır'});document.querySelector('.form').addEventListener('submit',e=>{e.preventDefault();document.querySelector('.status').textContent=document.querySelector('#code').value.trim()?'Kod kontrol ediliyor':'Kod girin'});</script></body></html>
