<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B1224">
<title>Warsigil · Posta</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Cinzel:wght@800;900&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070D1B;color:#F4ECD8;font-family:"Barlow Semi Condensed",system-ui,sans-serif;touch-action:manipulation}#area{position:absolute;inset:0;overflow:hidden}#scene{position:absolute;left:0;top:0;width:844px;height:390px;transform-origin:0 0;overflow:hidden;background:#0B1224}.title{position:absolute;left:28px;top:13px;margin:0;color:#F6D88E;font:900 22px/1 Cinzel,Georgia,serif;letter-spacing:.07em;text-shadow:1px 1px #000}#liste{position:absolute;left:10px;top:0;z-index:4;color:#F4ECD8;font-size:14px;text-decoration:none;padding:13px 7px 4px;min-height:44px;background:transparent;border:0}.top{position:absolute;left:122px;right:24px;top:10px;height:42px;display:flex;align-items:center;gap:10px}.select,.sort{height:38px;border:1px solid #C9A04E;border-radius:7px;background:#121B33;color:#F4ECD8;font:600 15px "Barlow Semi Condensed",sans-serif;padding:0 12px}.select{width:190px}.sort{width:46px;border-radius:50%;font-size:20px;padding:0}.capacity{margin-left:auto;color:#A9B4D0;font-size:14px;white-space:nowrap}.list{position:absolute;left:122px;right:24px;top:62px;bottom:62px;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;display:flex;flex-direction:column;gap:7px;padding-right:3px}.row{height:62px;min-height:62px;display:grid;grid-template-columns:52px minmax(0,1fr) 88px 84px 104px;align-items:center;gap:10px;padding:5px 10px;background:#121B33;border:1px solid #C9A04E;border-radius:7px}.slot{height:44px;width:44px;border:1px dashed #A9B4D0;border-radius:6px;color:#A9B4D0;display:grid;place-items:center;text-align:center;font-size:10px;line-height:1.1}.slot small{font-size:10px}.name{font-size:16px;font-weight:700;line-height:1.1}.kind{font-size:12px;color:#A9B4D0;margin-top:3px}.reward{width:76px;height:44px;border:1px dashed #A9B4D0;border-radius:6px;color:#A9B4D0;display:grid;place-items:center;text-align:center;font-size:10px;line-height:1.05}.time{font-size:13px;color:#FFB547;text-align:center}.pill{height:44px;min-width:76px;border:1px solid #C9A04E;border-radius:999px;background:#172441;color:#F6D88E;font:700 14px "Barlow Semi Condensed",sans-serif;padding:0 12px;touch-action:manipulation}.pill.green{background:#10583E;border-color:#C9A04E;color:#F4ECD8}.bottom{position:absolute;left:122px;right:24px;bottom:9px;height:44px;display:flex;justify-content:flex-end;gap:10px}.blank{color:#A9B4D0;font-size:14px;text-align:center;padding:24px}.shade{position:absolute;inset:0;background:#050914c9;display:grid;place-items:center;z-index:5}.modal{width:420px;min-height:185px;padding:22px;background:#121B33;border:1px solid #C9A04E;border-radius:7px;position:relative}.modal h2{margin:0 44px 16px 0;color:#F6D88E;font:900 19px Cinzel,Georgia,serif}.modal p{margin:0;font-size:16px;line-height:1.3}.x{position:absolute;right:5px;top:5px;width:44px;height:44px;border:0;background:none;color:#F4ECD8;font-size:25px;touch-action:manipulation}.hidden{display:none}@media(orientation:portrait){#scene{visibility:hidden}}
</style>
</head>
<body><div id="area"><main id="scene"><a id="liste" href="../">← Liste</a><h1 class="title">POSTA</h1>
<div class="top"><select class="select" id="filter" aria-label="Posta türü"><option value="Tümü">Tümü</option><option value="Ödüllü">Ödüllü</option><option value="Duyuru">Duyuru</option></select><select class="select" id="order" aria-label="Sıralama"><option value="date">Tarihe Göre</option><option value="time">Süreye Göre</option></select><button class="sort" id="direction" aria-label="Sıralama yönü">↓</button><span class="capacity">Kapasite: — / —</span></div>
<section class="list" id="messages" aria-label="Posta listesi"></section><div class="bottom"><button class="pill green" id="collectAll">Hepsini Topla</button></div>
<div class="shade hidden" id="shade"><section class="modal" role="dialog" aria-modal="true"><button class="x" id="close" aria-label="Kapat">×</button><h2 id="modalTitle"></h2><p id="modalText"></p></section></div>
</main></div>
<script>
const mail=[
 {title:'Sezon sonu ödülleri',kind:'Ödül',hasReward:true,days:30,text:'Sezon sonunda toplanmamış ödüller posta kutusuna gönderildi.'},
 {title:'Haftalık Arena lig ödülü',kind:'Ödül',hasReward:true,days:30,text:'Haftalık Arena lig ödülün hazır.'},
 {title:'Bakım ve kutlama hediyesi',kind:'Duyuru',hasReward:true,days:30,text:'Bakım ve kutlama hediyesi posta kutuna ulaştı.'},
 {title:'Savaş alanından haberler',kind:'Duyuru',hasReward:false,days:30,text:'Yeni duyuruları burada görüntüleyebilirsin.'}
];let descending=true;
const list=document.getElementById('messages');
function render(){const filter=document.getElementById('filter').value;let rows=mail.filter(m=>filter==='Tümü'||(filter==='Ödüllü'?m.hasReward:m.kind==='Duyuru'));if(!descending)rows=rows.slice().reverse();list.innerHTML='';if(!rows.length){list.innerHTML='<div class="blank">Posta bulunmuyor</div>';return}rows.forEach(m=>{const i=mail.indexOf(m),row=document.createElement('article');row.className='row';row.innerHTML='<div class="slot">Görsel<br>gerekli<small>44×44</small></div><div><div class="name"></div><div class="kind"></div></div><div class="reward">Görsel gerekli<br>76×44</div><div class="time">'+m.days+' gün</div><button class="pill '+(m.hasReward?'green':'')+'">'+(m.hasReward?'Topla':'Aç')+'</button>';row.querySelector('.name').textContent=m.title;row.querySelector('.kind').textContent=m.kind;row.querySelector('button').addEventListener('pointerup',()=>m.hasReward?collect(i):open(m));row.addEventListener('pointerup',e=>{if(!m.hasReward&&!e.target.closest('button'))open(m)});list.append(row)})}
function open(m){document.getElementById('modalTitle').textContent=m.title;document.getElementById('modalText').textContent=m.text;document.getElementById('shade').classList.remove('hidden')}
function collect(i){mail.splice(i,1);render()}
document.getElementById('filter').addEventListener('change',render);document.getElementById('order').addEventListener('change',()=>{descending=document.getElementById('order').value==='date';render()});document.getElementById('direction').addEventListener('pointerup',e=>{descending=!descending;e.currentTarget.textContent=descending?'↓':'↑';render()});document.getElementById('collectAll').addEventListener('pointerup',()=>{for(let i=mail.length-1;i>=0;i--)if(mail[i].hasReward)mail.splice(i,1);render()});const shade=document.getElementById('shade');document.getElementById('close').addEventListener('pointerup',()=>shade.classList.add('hidden'));shade.addEventListener('pointerup',e=>{if(e.target===shade)shade.classList.add('hidden')});
function fit(){const s=Math.min(innerWidth/844,innerHeight/390);document.getElementById('scene').style.transform='translate('+((innerWidth-844*s)/2)+'px,'+((innerHeight-390*s)/2)+'px) scale('+s+')'}addEventListener('resize',fit);fit();render();
</script></body></html>
