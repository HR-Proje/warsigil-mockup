<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B1224">
<title>Warsigil · Giriş ve İlerleme Ödülleri</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0B1224;color:#F4ECD8;font-family:"Barlow Semi Condensed",system-ui,sans-serif}body{position:fixed;inset:0;touch-action:manipulation}.stage{position:absolute;width:844px;height:390px;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#1a2746,#0B1224 70%)}#liste{position:absolute;left:10px;top:8px;z-index:3;color:#F4ECD8;font-size:12px;text-decoration:none;padding:8px}.window{position:absolute;left:50%;top:50%;width:700px;height:330px;transform:translate(-50%,-50%);border:1px solid #C9A04E;border-radius:8px;background:#121B33;box-shadow:0 12px 40px #0009;overflow:hidden}.head{height:48px;border-bottom:1px solid #765a2e;display:flex;align-items:center;justify-content:center}.head h1{margin:0;color:#F6D88E;font:900 19px/1 Cinzel,Georgia,serif;letter-spacing:.06em;text-transform:uppercase}.close{position:absolute;right:4px;top:2px;width:44px;height:44px;border:0;background:transparent;color:#F4ECD8;font:400 27px/1 system-ui;cursor:pointer}.tabs{display:flex;gap:8px;justify-content:center;padding:9px 12px 5px}.tab,.action{min-height:38px;border:1px solid #92743b;border-radius:999px;padding:0 17px;background:#172441;color:#F4ECD8;font:700 14px "Barlow Semi Condensed",system-ui;cursor:pointer}.tab[aria-selected=true]{background:#C9A04E;color:#151626}.content{height:207px;padding:7px 20px 12px}.status{text-align:center;color:#A9B4D0;font-size:13px;margin:0 0 8px}.cards{height:164px;display:flex;gap:8px;overflow:auto;align-items:stretch;scrollbar-color:#92743b #121B33;scrollbar-width:thin}.card{flex:0 0 88px;border:1px solid #705a35;border-radius:7px;background:#172441;padding:7px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px}.card.current{border-color:#F6D88E;box-shadow:inset 0 0 0 1px #F6D88E}.card small{font-size:12px;color:#A9B4D0}.slot{width:60px;height:70px;border:1px dashed #A9B4D0;border-radius:6px;display:grid;place-content:center;color:#A9B4D0;font-size:12px;line-height:1.2}.reward{font-weight:700;font-size:12px}.foot{height:48px;display:flex;align-items:center;justify-content:center;border-top:1px solid #293653}.action{min-width:130px;background:#246447;border-color:#3f9668;font-weight:800}.action:disabled{background:#293653;border-color:#52607a;color:#A9B4D0}.hidden{display:none}
</style>
</head>
<body><main class="stage" id="stage"><a id="liste" href="../">← Liste</a><section class="window" aria-label="Ödül pencereleri"><header class="head"><h1 id="title">Günlük Giriş</h1><button class="close" id="close" aria-label="Kapat">×</button></header><nav class="tabs" aria-label="Ödül türleri"><button class="tab" data-page="daily" aria-selected="true">Günlük Giriş</button><button class="tab" data-page="level" aria-selected="false">Seviye Ödülleri</button><button class="tab" data-page="play" aria-selected="false">Oynayış Ödülleri</button></nav><div class="content"><p class="status" id="status"></p><div class="cards" id="cards"></div></div><footer class="foot"><button class="action" id="claim">Ödülü Topla</button></footer></section></main>
<script>
const pages={daily:{title:'Günlük Giriş',status:'7 günlük döngü · Kaçırılan gün döngüyü sıfırlamaz',items:['20.000 Altın','20 Zümrüt','Komutan XP','30 Zümrüt','20 Madalya','50 Zümrüt','1 Gümüş Paket + 50 Zümrüt'],button:'Ödülü Topla',current:0},level:{title:'Seviye Ödülleri',status:'Seviye ödülleri · Seviye 60 sonrası Hesap XP’si birikmez',items:['20 Zümrüt · 10.000 Altın','3: Tecrübe Desteği','5: Gümüş Paket','6: Tecrübe Desteği','9: Tecrübe Desteği','10: Altın Komutan Paketi','15: Gümüş Paket','20: Altın Komutan Paketi','25: Gümüş Paket','30: Altın Komutan Paketi','35: Gümüş Paket','40: Altın Komutan Paketi','45: Gümüş Paket','50: Altın Komutan Paketi','55: Gümüş Paket','60: Unvan + avatar çerçevesi'],button:'Seviyeye Git',current:-1},play:{title:'Oynayış Ödülleri',status:'Ödül eşikleri ve miktarları GDD’de belirtilmemiştir',items:['Görsel gerekli · ödül kartı · 88×164 px','Görsel gerekli · ödül kartı · 88×164 px','Görsel gerekli · ödül kartı · 88×164 px','Görsel gerekli · ödül kartı · 88×164 px'],button:'Ödülü Topla',current:-1}};
const title=document.getElementById('title'),status=document.getElementById('status'),cards=document.getElementById('cards'),claim=document.getElementById('claim');let active='daily';function show(key){active=key;const p=pages[key];title.textContent=p.title;status.textContent=p.status;cards.replaceChildren();p.items.forEach((item,i)=>{const card=document.createElement('article');card.className='card'+(i===p.current?' current':'');const label=key==='daily'?'Gün '+(i+1):key==='level'?(i===0?'Her seviye':'Seviye eşiği'):'Ödül';card.innerHTML='<small>'+label+'</small><div class="slot">Görsel gerekli<br>60×70 px</div><div class="reward"></div>';card.querySelector('.reward').textContent=item;cards.append(card)});claim.textContent=p.button;claim.disabled=key==='play';document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.page===key)))}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('pointerup',()=>show(b.dataset.page)));claim.addEventListener('pointerup',()=>{if(active==='daily'){claim.textContent='Toplandı';claim.disabled=true}});document.getElementById('close').addEventListener('pointerup',()=>location.href='../ana-ekran/');document.querySelector('.window').addEventListener('pointerup',e=>e.stopPropagation());document.getElementById('stage').addEventListener('pointerup',e=>{if(e.target.id!=='liste')location.href='../ana-ekran/'});function fit(){document.getElementById('stage').style.setProperty('--scale',Math.min(innerWidth/844,innerHeight/390))}addEventListener('resize',fit);fit();show('daily');
</script></body></html>
