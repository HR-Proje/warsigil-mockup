<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="robots" content="noindex"><title>Warsigil · Paket Açma</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1224;--panel:#121B33;--gold:#C9A04E;--title:#F6D88E;--text:#F4ECD8;--muted:#A9B4D0;--green:#1DB377;--red:#C8283A;--tier:#7CB7F2}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060A16;color:var(--text);font-family:"Barlow Semi Condensed",system-ui,sans-serif}button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}#area{position:absolute;inset:0;overflow:hidden}#scene{position:absolute;left:0;top:0;width:844px;height:390px;transform-origin:0 0;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#1A2647,var(--bg) 75%)}#liste{position:absolute;z-index:20;left:9px;top:3px;min-height:44px;padding:12px 7px 5px;color:var(--text);font-size:12px;text-decoration:none;text-shadow:0 1px #000;opacity:.85}.head{position:absolute;inset:0 0 auto;height:43px;border-bottom:1px solid #725B2D;background:#10192e;display:flex;align-items:center;justify-content:center}.head h1{margin:0;color:var(--title);font:900 18px/1 Cinzel,serif;letter-spacing:.08em}.x{position:absolute;right:2px;top:0;width:44px;height:44px;min-width:44px;min-height:44px;padding:0;border:0;border-radius:0;background:transparent;color:var(--text);font-size:26px}.stage{position:absolute;left:28px;right:28px;top:57px;bottom:58px;display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:stretch}.panel{min-width:0;border:1px solid var(--gold);border-radius:7px;background:rgba(18,27,51,.88);padding:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;overflow:hidden}.panel h2{margin:0;color:var(--title);font:900 13px Cinzel,serif;letter-spacing:.04em}.card{position:relative;width:108px;height:154px;border:1px solid var(--tier);border-radius:7px;background:linear-gradient(160deg,#263b5d,#111a2d);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;box-shadow:0 0 14px #7cb7f244}.portrait{width:68px;height:72px;border:1px dashed var(--muted);border-radius:6px;display:flex;align-items:center;justify-content:center;padding:5px;color:var(--muted);font-size:12px;line-height:1.1}.card strong{color:var(--text);font-size:14px}.tier{font-size:12px;color:var(--tier);font-weight:800}.frow{display:flex;align-items:center;gap:4px;color:var(--title);font-size:13px;font-weight:800}.star{color:#FFDF72;font-size:19px;opacity:.35}.star.lit{opacity:1;animation:ignite .55s ease both}.center{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.vs{font:900 16px Cinzel,serif;color:var(--gold)}.beam{position:absolute;inset:15% 5%;pointer-events:none;background:radial-gradient(ellipse,#EAC66A1c,transparent 68%)}.merge-glow{position:absolute;width:190px;height:190px;border:2px solid var(--tier);border-radius:50%;opacity:0;box-shadow:0 0 30px var(--tier);pointer-events:none}.stats{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:3px 8px;text-align:right;font-size:12px}.stats span:first-child{color:var(--muted);text-align:left}.stats b{min-width:44px}.new{color:#9FE1B9}.old{color:#A9B4D0}.bottom{position:absolute;left:16px;right:16px;bottom:7px;height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px}.progress{color:var(--muted);font-size:12px;min-width:120px}.actions{display:flex;gap:7px}.pill{min-height:42px;padding:0 15px;border:1px solid var(--gold);border-radius:999px;background:#26355F;color:var(--text);font-size:13px;font-weight:800}.pill.green{background:var(--green);color:#071b15}.pill.red{background:#401923;border-color:var(--red)}.veil{position:absolute;inset:43px 0 50px;display:none;align-items:center;justify-content:center;background:#02050dcc;z-index:10}.veil.open{display:flex}.result{width:600px;height:272px;border:1px solid var(--gold);border-radius:8px;background:var(--panel);padding:14px;position:relative;display:flex;flex-direction:column;gap:8px}.result h2{margin:0;text-align:center;color:var(--title);font:900 16px Cinzel,serif}.results{flex:1;display:flex;justify-content:center;align-items:center;gap:12px;overflow:hidden}.result-card{height:172px;width:108px;flex:0 0 108px;border:1px solid var(--gold);border-radius:7px;background:#182744;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-weight:800}.result-card .portrait{height:68px}.copytag{font-size:11px;color:#9FE1B9}.result .x{right:0}.result-foot{display:flex;justify-content:center;gap:8px}.toast{position:absolute;z-index:30;left:50%;top:49px;transform:translateX(-50%);padding:7px 12px;border:1px solid var(--gold);border-radius:7px;background:var(--panel);color:var(--title);font-size:12px;display:none}.toast.show{display:block}.card.enter{animation:reveal .55s ease both}.card.copy-in{animation:copyMove 1.25s ease-in-out both}.merge-glow.on{animation:ring 1.2s ease both}@keyframes reveal{from{transform:scale(.65) rotateY(80deg);opacity:0}to{transform:none;opacity:1}}@keyframes copyMove{0%{transform:translateX(0) scale(1);opacity:1}60%{transform:translateX(-123px) scale(.8);opacity:1}100%{transform:translateX(-123px) scale(.15);opacity:0}}@keyframes ring{0%{opacity:0;transform:scale(.55)}45%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.2)}}@keyframes ignite{0%{transform:scale(.3);opacity:0}65%{transform:scale(1.35);opacity:1}100%{transform:scale(1);opacity:1}}@media(orientation:portrait){#scene{visibility:hidden}}

/* Denetim grubu 4/5: ortak dokunma ve kapatma ?l??s? */
#liste{left:8px!important;top:2px!important;min-width:64px;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;padding:0 7px!important;border:0!important;border-radius:0!important;background:transparent!important;text-shadow:none!important;opacity:1!important}
.x,.close{width:44px!important;height:44px!important;min-width:44px;min-height:44px;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;color:#F4ECD8!important;box-shadow:none!important}
</style></head><body><div id="area"><main id="scene" aria-label="Paket açma ve kopya birleşmesi"><a id="liste" href="../">← Liste</a><header class="head"><h1 id="title">PAKET AÇILIYOR</h1><button class="x" data-action="home" aria-label="Kapat">×</button></header><section class="stage" id="stage"></section><div class="bottom"><span class="progress" id="progress">Açılış hazırlanıyor</span><div class="actions"><button class="pill red" data-action="skip">Tümünü Atla</button><button class="pill" data-action="again">Tekrar Aç</button><button class="pill green" data-action="shop">Mağazaya Dön</button></div></div><div class="veil" id="veil"><section class="result" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><button class="x" data-action="close-result" aria-label="Kapat">×</button><h2 id="resultTitle">AÇILAN KOMUTANLAR</h2><div class="results" id="results"></div><div class="result-foot"><button class="pill" data-action="again">Tekrar Aç</button><button class="pill green" data-action="shop">Mağazaya Dön</button><button class="pill" data-action="roster">Komutanlara Git</button></div></section></div><div class="toast" id="toast" role="status"></div></main></div>
<script>
(function(){'use strict';var area=document.getElementById('area'),scene=document.getElementById('scene'),stage=document.getElementById('stage'),title=document.getElementById('title'),progress=document.getElementById('progress'),veil=document.getElementById('veil'),results=document.getElementById('results'),toast=document.getElementById('toast');var timer=null,index=0,busy=false,done=false,mergeList=[],mergeIndex=0;var pulls=[{name:'Örnek Muhafız',tier:'GÜMÜŞ',copy:false,f0:'F0',f1:'F0'},{name:'Örnek Akıncı',tier:'ALTIN',copy:true,f0:'F6',f1:'F7'},{name:'Örnek İzci',tier:'BRONZ',copy:false,f0:'F0',f1:'F0'}];var stats=[['HP','—','—'],['ATK','—','—'],['DEF','—','—'],['Komutan Gücü','—','—']];function fit(){var s=Math.min(area.clientWidth/844,area.clientHeight/390);scene.style.transform='translate('+((area.clientWidth-844*s)/2)+'px,'+((area.clientHeight-390*s)/2)+'px) scale('+s+')'}function card(name,tier,cls){return '<div class="card '+(cls||'')+'"><div class="portrait">Görsel gerekli<br>'+name.toLocaleLowerCase('tr').replaceAll(' ','-')+'.png</div><strong>'+name+'</strong><span class="tier">'+tier+'</span><div class="frow"><span class="star">★</span><b>F0</b></div></div>'}function renderOpening(i){var p=pulls[i];stage.innerHTML='<div class="panel"><h2>ÇIKAN KART</h2>'+card(p.name,p.tier,'enter')+'</div><div class="center"><div class="beam"></div><div class="vs">✦</div><span class="tier">'+(i+1)+' / '+pulls.length+'</span></div><div class="panel"><h2>PAKET</h2><div class="portrait" style="width:104px;height:132px">Görsel gerekli<br>paket-karti.png<br>104 × 132 px</div></div>';progress.textContent='Kartlar sırayla açılıyor';if(i+1<pulls.length){timer=setTimeout(function(){renderOpening(i+1)},920)}else{timer=setTimeout(startMerges,720)}}function mergeMarkup(p){return '<div class="panel"><h2>KOPYA BİRLEŞMESİ</h2><div class="frow"><b>'+p.f0+' → '+p.f1+'</b></div><div class="stats">'+stats.map(function(s){return '<span>'+s[0]+'</span><b class="old">'+s[1]+'</b><b class="new">'+s[2]+'</b>'}).join('')+'</div></div>'}function startMerges(){mergeList=pulls.filter(function(p){return p.copy});mergeIndex=0;if(!mergeList.length){showResults();return}showMerge()}function showMerge(){if(mergeIndex>=mergeList.length){showResults();return}busy=true;var p=mergeList[mergeIndex];stage.innerHTML='<div class="panel"><h2>MEVCUT KART</h2>'+card(p.name,p.tier,'')+'</div><div class="center"><div class="merge-glow"></div>'+card(p.name,p.tier,'copy-in')+'<div class="vs">KOPYA BİRLEŞİYOR</div></div>'+mergeMarkup(p);var glow=stage.querySelector('.merge-glow');if(glow)glow.classList.add('on');var st=stage.querySelectorAll('.star');st.forEach(function(n){n.classList.add('lit')});progress.textContent='Kopya '+(mergeIndex+1)+' / '+mergeList.length+' · dokunarak geç';timer=setTimeout(function(){busy=false;mergeIndex++;showMerge()},1500)}function showResults(){busy=false;done=true;title.textContent='PAKET SONUCU';progress.textContent='Açılan kartlar';results.innerHTML=pulls.map(function(p){return '<div class="result-card"><div class="portrait">Görsel gerekli<br>'+p.name.toLocaleLowerCase('tr').replaceAll(' ','-')+'.png</div><span>'+p.name+'</span><span class="tier">'+p.tier+'</span>'+(p.copy?'<span class="copytag">+1 KOPYA · '+p.f0+' → '+p.f1+'</span>':'')+'</div>'}).join('');veil.classList.add('open')}function begin(){clearTimeout(timer);veil.classList.remove('open');mergeList=[];mergeIndex=0;title.textContent='PAKET AÇILIYOR';index=0;busy=false;done=false;renderOpening(0)}function skip(){clearTimeout(timer);busy=false;showResults()}function notice(s){toast.textContent=s;toast.classList.add('show');clearTimeout(notice.t);notice.t=setTimeout(function(){toast.classList.remove('show')},1500)}document.addEventListener('pointerdown',function(e){if(veil.classList.contains('open'))return;if(done)return;if(busy){clearTimeout(timer);busy=false;mergeIndex++;notice('Birleşme uygulandı.');showMerge();return}if(!e.target.closest('button,a')){clearTimeout(timer);startMerges()}});document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var a=b.dataset.action;if(a==='skip'){skip()}else if(a==='again'){begin()}else if(a==='shop'){location.href='../dukkan/'}else if(a==='roster'){location.href='../komutan-dizini/'}else if(a==='home'){location.href='../ana-ekran/'}else if(a==='close-result'){veil.classList.remove('open')}});veil.addEventListener('pointerdown',function(e){if(e.target===veil)veil.classList.remove('open')});window.addEventListener('resize',fit);window.addEventListener('orientationchange',fit);fit();begin()})();
</script></body></html>
