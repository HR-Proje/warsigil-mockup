<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1224">
<title>Warsigil · Pazar Rafları</title>
<style>
*{box-sizing:border-box} [hidden]{display:none!important}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0B1224;color:#F4ECD8}body{font:600 14px/1.15 'Barlow Semi Condensed',system-ui,sans-serif;touch-action:none;user-select:none}#stage{position:absolute;width:844px;height:390px;left:50%;top:50%;transform-origin:center center;overflow:hidden;background:radial-gradient(ellipse at 68% 0%,#1b2946,#0B1224 65%)}#liste{position:absolute;left:10px;top:7px;z-index:3;color:#F4ECD8;font-size:12px;text-decoration:none;padding:4px 8px;border-radius:999px;background:#121B33;border:1px solid #C9A04E}.top{height:48px;padding:8px 55px 7px 93px;border-bottom:1px solid #C9A04E;display:flex;align-items:center;justify-content:space-between}.title{font:900 19px/1 Cinzel,Georgia,serif;letter-spacing:.05em;color:#F6D88E}.balance{display:flex;gap:9px}.pill{border:1px solid #735b32;background:#121B33;border-radius:999px;padding:5px 10px;font-size:12px}.layout{height:342px;display:grid;grid-template-columns:168px 1fr;gap:10px;padding:9px 13px 10px}.rail{display:flex;flex-direction:column;gap:7px}.tab{height:58px;border-radius:7px;border:1px solid #69552f;background:#121B33;color:#A9B4D0;text-align:left;padding:0 10px;font-weight:800;font-size:14px;touch-action:manipulation}.tab.active{color:#F6D88E;border-color:#C9A04E;background:linear-gradient(90deg,#263650,#121B33)}.tab small{display:block;color:#A9B4D0;font-size:11px;margin-top:3px}.content{min-width:0;position:relative;border:1px solid #C9A04E;border-radius:7px;background:rgba(18,27,51,.87);padding:8px 10px 9px;overflow:hidden}.bar{height:28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #51452f;margin-bottom:6px}.bar strong{color:#F6D88E;font:800 13px Cinzel,Georgia,serif;letter-spacing:.04em}.actions{display:flex;align-items:center;gap:8px}.timer{color:#FFB547;font-size:12px}.btn{border:1px solid #C9A04E;border-radius:999px;background:#183a31;color:#F4ECD8;padding:6px 13px;min-height:32px;font:800 12px 'Barlow Semi Condensed',system-ui,sans-serif;touch-action:manipulation}.btn:active,.tab:active,.card:active{filter:brightness(1.25)}.emerald{color:#7ee0ae}.shelf{height:270px;display:grid;grid-auto-flow:column;grid-template-rows:1fr 1fr;grid-auto-columns:156px;gap:7px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;touch-action:pan-x;scrollbar-color:#806533 #121B33;scrollbar-width:thin}.card{scroll-snap-align:start;min-width:0;border:1px solid #69552f;border-radius:7px;background:linear-gradient(160deg,#1b2945,#10182c);padding:7px;display:flex;flex-direction:column;position:relative;touch-action:manipulation;text-align:left;color:#F4ECD8}.card.locked{opacity:.62}.cardhead{display:flex;justify-content:space-between;gap:3px;font-size:12px;color:#F6D88E;font-weight:800}.tag{font-size:10px;color:#FFB547}.slot{flex:1;min-height:0;margin:5px 0;border:1px dashed #8c7445;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#A9B4D0;font-size:11px;line-height:1.2;padding:4px}.slot b{font-size:12px;color:#F4ECD8;font-weight:700}.price{display:flex;justify-content:space-between;align-items:center;font-size:12px}.price b{color:#F6D88E}.open{color:#72DCA5}.grid-six{height:270px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:7px}.grid-six .card{min-height:0}.subtabs{display:flex;gap:6px;height:30px;margin:0 0 6px}.subtab{border:1px solid #665433;border-radius:999px;background:#10182c;color:#A9B4D0;padding:4px 13px;font-size:12px;touch-action:manipulation}.subtab.active{color:#F6D88E;border-color:#C9A04E}.modalShade{position:absolute;inset:0;background:rgba(1,4,12,.76);display:none;align-items:center;justify-content:center;z-index:5}.modalShade.show{display:flex}.modal{width:440px;max-height:330px;border:1px solid #C9A04E;border-radius:7px;background:#121B33;padding:15px;position:relative}.modal h2{margin:2px 45px 12px 0;color:#F6D88E;font:900 17px Cinzel,Georgia,serif}.modal .x{position:absolute;right:8px;top:6px;width:44px;height:44px;border:0;background:transparent;color:#F4ECD8;font:400 24px/1 system-ui;border-radius:0;padding:0;touch-action:manipulation}.modalrow{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center}.modal .slot{height:118px}.modal p{margin:0 0 10px;font-size:13px;color:#A9B4D0}.modal .btn{margin-top:10px}.empty{display:none}

/* Denetim grubu 4/5: ortak dokunma ve kapatma ?l??s? */
#liste{left:8px!important;top:2px!important;min-width:64px;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;padding:0 7px!important;border:0!important;border-radius:0!important;background:transparent!important;text-shadow:none!important;opacity:1!important}
.x,.close{width:44px!important;height:44px!important;min-width:44px;min-height:44px;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;color:#F4ECD8!important;box-shadow:none!important}
</style>
</head>
<body>
<main id="stage">
<a id="liste" href="../">← Liste</a>
<header class="top"><div class="title">PAZAR</div><div class="balance"><span class="pill">Altın&nbsp; <b>—</b></span><span class="pill">Madalya&nbsp; <b>—</b></span><span class="pill">Zümrüt&nbsp; <b>—</b></span></div></header>
<div class="layout">
<nav class="rail" aria-label="Pazar rafları">
<button class="tab active" data-tab="cephanelik">Cephanelik</button>
<button class="tab" data-tab="arena">Arena Mağazası<small>Sv 8</small></button>
<button class="tab" data-tab="sezon">Sezon Dükkânı<small>Sv 5</small></button>
</nav>
<section class="content" aria-live="polite">
<div class="bar"><strong id="sectionTitle">CEPHANELİK</strong><div class="actions"><span class="timer" id="timer">Yenilenmeye kalan —</span><button id="refresh" class="btn">Şimdi Yenile <span class="emerald">· Zümrüt</span></button></div></div>
<div class="subtabs" id="subtabs" hidden><button class="subtab active" data-shelf="sezonpaket">Komutan Paketi</button><button class="subtab" data-shelf="gelisim">Geliştirme Rafı</button><button class="subtab" data-shelf="sandik">Sınırlı Sandıklar</button></div>
<div class="shelf" id="equipment"></div><div class="grid-six" id="arenaGrid" hidden></div><div class="grid-six" id="seasonGrid" hidden></div>
</section></div>
<div class="modalShade" id="shade"><section class="modal" role="dialog" aria-modal="true"><button class="x" id="close" aria-label="Kapat">×</button><h2 id="modalTitle"></h2><div class="modalrow"><div class="slot" id="modalSlot"></div><div><p id="modalText"></p><div id="modalPrice"></div><button class="btn" id="buy">Satın Al</button></div></div></section></div>
</main>
<script>
(function(){
const stage=document.getElementById('stage');function fit(){const s=Math.min(innerWidth/844,innerHeight/390);stage.style.transform='translate(-50%,-50%) scale('+s+')'}addEventListener('resize',fit);fit();
const equip=document.getElementById('equipment'),arena=document.getElementById('arenaGrid'),season=document.getElementById('seasonGrid'),title=document.getElementById('sectionTitle'),subtabs=document.getElementById('subtabs');let current='cephanelik',seasonShelf='sezonpaket';
const armor=Array.from({length:12},(_,i)=>({name:['Silah','Zırh','Miğfer','Nişan'][i%4],set:['Akıncı','Muhafız','Vatan'][Math.floor(i/4)%3],cost:'Madalya',tag:i<4?'AÇIK':'KİLİTLİ',locked:i>=4}));
function card(item,i){const el=document.createElement('button');el.className='card'+(item.locked?' locked':'');el.type='button';el.innerHTML='<span class="cardhead"><span>'+item.set+' · '+item.name+'</span><span class="tag">'+item.tag+'</span></span><span class="slot"><b>Görsel gerekli</b><span>'+item.file+'<br>'+item.size+'</span></span><span class="price"><span>'+item.cost+'</span><b>'+item.price+'</b></span>';el.addEventListener('pointerup',()=>open(item));return el}
armor.forEach((x,i)=>{x.file='ekipman-'+x.name.toLocaleLowerCase('tr-TR')+'.png';x.size='140×88';x.price=x.locked?'Açılış koşulu':'—';equip.append(card(x,i))});
const arenaItems=[['İmparator Komutan','1 yuva · haftalık','Arena Jetonu'],...Array.from({length:5},(_,i)=>['Altın Komutan '+(i+1),'Haftalık vitrin','Arena Jetonu'])].map(x=>({set:'Komutanlar',name:x[0],tag:x[1],cost:x[2],price:'—',file:'arena-komutan.png',size:'112×88'}));
const seasonData={sezonpaket:[['Sezon Komutan Paketi','Tekli çekiliş'],['Sezon Komutan Paketi','10’lu çekiliş']],gelisim:[['Küçük Tecrübe Kitabı','Sezon sınırı'],['Orta Tecrübe Kitabı','Sezon sınırı'],['Büyük Tecrübe Kitabı','Sezon sınırı'],['Altın Tier F-Materyali','Sezon sınırı'],['İmparator Tier F-Materyali','Sezon sınırı']],sandik:[['Haftalık Sefer Sandığı','Haftada 1'],['Sezon Hazinesi','Sezonda 1']]};
function paintSeason(){season.replaceChildren();seasonData[seasonShelf].forEach((x,i)=>season.append(card({set:'Sezon Dükkânı',name:x[0],tag:x[1],cost:'Sezon Jetonu',price:'—',file:'sezon-'+i+'.png',size:'112×88'},i)))}
arenaItems.forEach((x,i)=>arena.append(card(x,i)));paintSeason();
function setTab(t){current=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));equip.hidden=t!=='cephanelik';arena.hidden=t!=='arena';season.hidden=t!=='sezon';subtabs.hidden=t!=='sezon';season.style.height=t==='sezon'?'234px':'270px';title.textContent={cephanelik:'CEPHANELİK',arena:'ARENA MAĞAZASI',sezon:'SEZON DÜKKÂNI'}[t];document.getElementById('refresh').hidden=t!=='cephanelik';document.getElementById('timer').textContent=t==='cephanelik'?'Yenilenmeye kalan —':t==='arena'?'Haftalık yenilenmeye kalan —':'Sezon rafı'}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('pointerup',()=>setTab(b.dataset.tab)));
document.querySelectorAll('.subtab').forEach(b=>b.addEventListener('pointerup',()=>{seasonShelf=b.dataset.shelf;document.querySelectorAll('.subtab').forEach(q=>q.classList.toggle('active',q===b));paintSeason()}));
let activeItem;function open(item){activeItem=item;document.getElementById('modalTitle').textContent=item.set+' · '+item.name;document.getElementById('modalSlot').innerHTML='<b>Görsel gerekli</b><span>'+item.file+' · '+item.size+'</span>';document.getElementById('modalText').textContent=item.tag+(item.locked?' · Açılış seviyesi gelince açılır.':'');document.getElementById('modalPrice').textContent=item.cost+' · '+item.price;document.getElementById('buy').textContent=item.locked?'Kilitli':'Satın Al';document.getElementById('buy').disabled=!!item.locked;document.getElementById('shade').classList.add('show')}
function close(){document.getElementById('shade').classList.remove('show')}document.getElementById('close').addEventListener('pointerup',close);document.getElementById('shade').addEventListener('pointerup',e=>{if(e.target.id==='shade')close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.getElementById('refresh').addEventListener('pointerup',()=>open({set:'Raf',name:'Şimdi Yenile',tag:'Günlük hak sınırı',cost:'Zümrüt',price:'—',file:'raf-yenileme.png',size:'44×44'}));document.getElementById('buy').addEventListener('pointerup',()=>{if(activeItem&&!activeItem.locked){document.getElementById('buy').textContent='Satın Alındı'}})
})();
</script>
</body>
</html>
