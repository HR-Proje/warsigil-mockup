<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="robots" content="noindex"><title>Warsigil · Savaş Sonucu</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#0B1224;--panel:#121B33;--gold:#C9A04E;--title:#F6D88E;--text:#F4ECD8;--muted:#A9B4D0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060A16;color:var(--text)}body{position:fixed;inset:0;touch-action:none;user-select:none;font-family:'Barlow Semi Condensed',sans-serif}button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}#area{position:absolute;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}#scene{position:absolute;width:844px;height:390px;transform-origin:0 0;overflow:hidden;background:radial-gradient(ellipse at 50% 34%,#1b2b48,#0B1224 75%)}#liste{position:absolute;z-index:5;left:8px;top:1px;min-width:68px;min-height:44px;padding:12px 7px 5px;color:var(--text);opacity:.8;font-size:12px;text-decoration:none}.head{height:66px;border-bottom:1px solid var(--gold);background:linear-gradient(90deg,#101829,#1b2435 50%,#101829);position:relative;padding:7px 14px}.stage{position:absolute;left:17px;top:11px;color:var(--title);font-size:15px;font-weight:700}.times{position:absolute;left:17px;top:32px;font-size:12px;color:var(--muted)}.best{margin-left:12px;color:#72D6E8}.stage-link{position:absolute;right:62px;top:7px;min-height:44px;padding:0 10px;border:0;background:none;color:var(--title);font-weight:700;font-size:14px}.energy{position:absolute;right:14px;top:34px;color:var(--muted);font-size:12px}.x{position:absolute;right:7px;top:3px;width:44px;height:44px;border:0;background:transparent;color:var(--text);font-size:22px}.banner{position:absolute;z-index:1;left:50%;top:4px;transform:translateX(-50%);width:236px;height:61px;border:1px solid var(--gold);border-radius:8px;background:linear-gradient(#26314a,#121b33);text-align:center;box-shadow:0 5px 18px #0008}.banner.loss{border-color:#b54a50;background:linear-gradient(#4c2635,#241725)}.stars{height:24px;color:var(--title);font-size:20px;letter-spacing:7px}.stars.empty{color:#54566a}.banner h1{margin:-1px 0 0;font:900 23px/1 Cinzel,serif;color:var(--title)}.reward{position:absolute;left:0;right:0;top:66px;height:60px;display:flex;justify-content:center;align-items:center;gap:10px;border-bottom:1px solid var(--gold);background:linear-gradient(90deg,#122d43,#214b61 50%,#122d43)}.reward.loss{height:36px;background:linear-gradient(90deg,#461d29,#8b303a 50%,#461d29)}.reward-label{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-weight:700;color:var(--title);font-size:14px}.loot{width:46px;height:42px;margin-top:12px;border:1px dashed var(--muted);border-radius:5px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:11px;line-height:1.05}.reward.loss .reward-label{top:7px;color:var(--text);font-size:16px}.xpbadge{position:absolute;right:calc(50% - 140px);top:0;width:32px;height:24px;border-radius:0 0 7px 7px;background:#18233b;border:1px solid var(--gold);text-align:center;color:var(--title);font-weight:700;font-size:13px}.team{position:absolute;left:120px;right:120px;top:132px;bottom:54px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;align-items:center}.member{height:196px;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.xp{width:76px;height:20px;color:#72D6E8;border-bottom:2px solid #548c97;font-size:12px;white-space:nowrap}.portrait{width:72px;height:78px;border:1px dashed var(--muted);border-radius:6px;background:#0b1224;display:grid;place-items:center;color:var(--muted);font-size:11px;line-height:1.1}.name{height:21px;padding-top:2px;font-weight:700;font-size:14px}.stats{width:88px;display:grid;gap:4px}.stat{height:13px;position:relative;border:1px solid #46536a;border-radius:3px;background:#090f1d;overflow:hidden}.stat i{display:block;height:100%;width:42%;background:#b83743}.stat.blue i{background:#3189bc;width:30%}.stat.green i{background:#27935f;width:22%}.stat span{position:absolute;left:0;right:0;top:-2px;font-size:11px;text-shadow:0 1px #000}.loss-state .team{grid-template-columns:1fr}.loss-state .member{height:202px}.bottom{position:absolute;left:12px;right:12px;bottom:6px;height:44px;display:flex;align-items:center;gap:8px}.shortcuts{display:flex;gap:6px;margin-right:auto}.circle{width:42px;height:42px;border:1px solid var(--gold);border-radius:50%;background:#172441;color:var(--title);font-size:11px;line-height:1.05}.pill{height:42px;min-width:112px;padding:0 15px;border:1px solid var(--gold);border-radius:999px;background:#21456a;color:var(--text);font-weight:700;font-size:14px}.pill.primary,.pill.next{background:#a9761e;color:#fff2d0}.loss-state .next{display:none}.veil{position:absolute;inset:0;z-index:8;background:#02050dcc;display:none;align-items:center;justify-content:center}.dialog{width:360px;min-height:150px;position:relative;padding:22px;border:1px solid var(--gold);border-radius:8px;background:var(--panel);text-align:center}.dialog h2{margin:7px 30px 15px;font:900 18px Cinzel,serif;color:var(--title)}.dialog p{margin:6px 0;color:var(--muted);font-size:14px}.dialog .pill{margin-top:8px}.dialog .x{right:2px;top:2px}@media(orientation:portrait){#scene{visibility:hidden}}
</style></head><body><div id="area"><main id="scene"><a id="liste" href="../">← Liste</a><header class="head"><div class="stage">HİKÂYE · AŞAMA</div><div class="times">Süre · — <span class="best">En iyi · —</span></div><button class="stage-link" id="stageOpen">Aşama Seçimi ›</button><div class="energy">Enerji ·</div><button class="x" id="close" aria-label="Kapat">×</button></header><section class="banner" id="banner"><div class="stars" id="stars">★★★</div><h1 id="outcome">ZAFER</h1></section><section class="reward" id="reward"><strong class="reward-label" id="rewardLabel">ÖDÜL</strong><span class="loot">Odul_Altin.png<br>46×42 px · Görsel gerekli</span><span class="loot">Odul_Tecrube.png<br>46×42 px · Görsel gerekli</span><span class="loot">Odul_Madalya.png<br>46×42 px · Görsel gerekli</span><span class="loot">Odul_Zumrut.png<br>46×42 px · Görsel gerekli</span><b class="xpbadge">XP</b></section><section class="team" id="team"></section><footer class="bottom"><nav class="shortcuts"><button class="circle" data-info="Şehir">Şehir</button><button class="circle" data-info="Harita">Harita</button><button class="circle" data-info="Komutanlar">Komutanlar</button></nav><button class="pill" id="retry">Tekrar</button><button class="pill" id="edit">Kadroyu Düzenle</button><button class="pill primary next" id="next">Sıradaki</button></footer><div class="veil" id="veil"><section class="dialog"><button class="x" id="modalClose" aria-label="Kapat">×</button><h2 id="dialogTitle"></h2><div id="dialogBody"></div></section></div></main></div><script>
(function(){const scene=document.getElementById('scene');function fit(){const s=Math.min(innerWidth/844,innerHeight/390);scene.style.left=((innerWidth-844*s)/2)+'px';scene.style.top=((innerHeight-390*s)/2)+'px';scene.style.transform='scale('+s+')'}addEventListener('resize',fit);fit();const loss=new URLSearchParams(location.search).get('sonuc')==='yenilgi';if(loss){document.body.classList.add('loss-state');document.getElementById('banner').classList.add('loss');document.getElementById('stars').classList.add('empty');document.getElementById('stars').textContent='☆☆☆';document.getElementById('outcome').textContent='YENİLGİ';document.getElementById('reward').classList.add('loss');document.getElementById('rewardLabel').textContent='ÖDÜL YOK'}const team=document.getElementById('team');for(let i=0;i<(loss?1:5);i++){const m=document.createElement('article');m.className='member';m.innerHTML='<div class="xp">'+(loss?'0 XP':'XP')+'</div><div class="portrait">Komutan_Portresi.png<br>72×78 px · Görsel gerekli</div><div class="name">Komutan</div><div class="stats"><div class="stat"><i></i><span>Hasar</span></div><div class="stat blue"><i></i><span>Alınan</span></div><div class="stat green"><i></i><span>İyileştirme</span></div></div>';team.appendChild(m)}const veil=document.getElementById('veil'),title=document.getElementById('dialogTitle'),body=document.getElementById('dialogBody');function open(t,msg){title.textContent=t;body.innerHTML='<p>'+msg+'</p><button class="pill" id="ok">Tamam</button>';veil.style.display='flex';document.getElementById('ok').addEventListener('pointerup',()=>veil.style.display='none')}document.getElementById('stageOpen').addEventListener('pointerup',()=>open('AŞAMA SEÇİMİ','Harita seçimi örnek penceresi'));document.querySelectorAll('[data-info]').forEach(b=>b.addEventListener('pointerup',()=>open(b.dataset.info,'Kısayol')));document.getElementById('modalClose').addEventListener('pointerup',()=>veil.style.display='none');veil.addEventListener('pointerup',e=>{if(e.target===veil)veil.style.display='none'});document.getElementById('retry').addEventListener('pointerup',()=>location.href='../kadro-hazirlik/');document.getElementById('edit').addEventListener('pointerup',()=>location.href='../kadro-hazirlik/');document.getElementById('next').addEventListener('pointerup',()=>open('SIRADAKİ AŞAMA','Sonraki aşama seçimi'));document.getElementById('close').addEventListener('pointerup',()=>location.href='../ana-ekran/')})();
</script></body></html>
