<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1224">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Cinzel:wght@800;900&display=swap" rel="stylesheet">
<title>Warsigil · Çağrı Otağı</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0B1224;color:#F4ECD8;font-family:"Barlow Semi Condensed",sans-serif}#wrap{position:absolute;inset:0;display:grid;place-items:center}#scene{position:relative;width:844px;height:390px;overflow:hidden;transform-origin:center;background:radial-gradient(ellipse at 54% 46%,#20365A 0,#121B33 43%,#0B1224 78%)}button,a{font:inherit;color:inherit}#liste{position:absolute;left:8px;top:4px;z-index:3;min-width:60px;height:44px;display:flex;align-items:center;color:#F4ECD8;text-decoration:none;font-size:13px;text-shadow:0 1px #000}.top{position:absolute;left:0;right:0;top:0;height:45px;background:rgba(7,13,28,.86);border-bottom:1px solid #C9A04E;display:flex;align-items:center;padding:0 51px 0 88px;gap:12px}.title{margin:0 auto 0 0;font:900 17px Cinzel,Georgia,serif;letter-spacing:.07em;color:#F6D88E;text-shadow:0 1px #000}.currency{height:28px;min-width:82px;padding:0 10px;border:1px solid rgba(201,160,78,.72);border-radius:999px;background:#121B33;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;text-shadow:0 1px #000}.close{position:absolute;right:3px;top:1px;width:44px;height:44px;border:0;background:none;color:#F4ECD8;font-size:27px;line-height:1;cursor:pointer}.left{position:absolute;left:8px;top:51px;bottom:8px;width:213px;display:flex;flex-direction:column;gap:5px;overflow:auto;scrollbar-width:none}.left::-webkit-scrollbar{display:none}.pack{position:relative;flex:0 0 68px;min-height:68px;padding:5px 7px 5px 59px;text-align:left;background:#121B33;border:1px solid #6B4E1C;border-radius:7px;cursor:pointer}.pack.selected{border-color:#8CD5E7;box-shadow:inset 0 0 0 1px rgba(140,213,231,.35);background:#172644}.pack .name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:800;color:#F4ECD8}.pack .owned{display:block;margin-top:2px;color:#A9B4D0;font-size:12px}.tiers{display:flex;gap:5px;margin-top:3px;font-size:12px;font-weight:800}.silver{color:#C7D3E8}.gold{color:#F6D88E}.imperial{color:#D9B5FF}.bronze{color:#D2A078}.slot{position:absolute;left:7px;top:8px;width:42px;height:48px;border:1px dashed #C9A04E;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#F6D88E;font-size:9px;line-height:1.05}.slot b{font-size:12px}.center{position:absolute;left:230px;right:117px;top:48px;bottom:8px;display:flex;flex-direction:column;align-items:center}.select{align-self:flex-start;display:flex;gap:5px;margin:0 0 5px 4px}.pill{height:44px;padding:0 18px;border:1px solid #C9A04E;border-radius:999px;background:#182541;color:#F4ECD8;font-size:14px;font-weight:800;cursor:pointer}.pill.active{background:#C9A04E;color:#111827}.pill:disabled{opacity:.38}.info{position:absolute;left:127px;top:0;width:44px;height:44px;border-radius:50%;border:1px solid #C9A04E;background:#121B33;color:#F6D88E;font-weight:800;cursor:pointer}.chamber{position:relative;width:100%;flex:1;min-height:0;border:1px solid #C9A04E;border-radius:8px;background:radial-gradient(ellipse at 50% 55%,rgba(29,179,119,.15),rgba(18,27,51,.55) 47%,rgba(11,18,36,.9));display:grid;place-items:center}.chamber:before,.chamber:after{content:"";position:absolute;border:1px solid rgba(201,160,78,.27);border-radius:50%;width:218px;height:218px}.chamber:after{width:166px;height:166px;border-color:rgba(201,160,78,.17)}.visual{position:relative;z-index:1;width:148px;height:132px;border:1px dashed #C9A04E;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#F6D88E;font-size:13px;line-height:1.2;background:rgba(11,18,36,.55)}.visual strong{font-weight:800}.details{width:100%;height:60px;display:flex;align-items:center;justify-content:center;gap:15px}.details strong{font-size:16px;color:#F6D88E}.guarantee{font-size:12px;color:#A9B4D0}.guarantee b{color:#F4ECD8}.action{height:44px;min-width:190px;padding:0 22px;border:1px solid #C9A04E;border-radius:999px;background:#1DB377;color:#061C14;font-size:15px;font-weight:800;cursor:pointer}.action:active,.pill:active,.pack:active{transform:scale(.98)}.right{position:absolute;right:8px;top:52px;bottom:8px;width:101px}.tab{width:100%;height:58px;border:1px solid #C9A04E;border-radius:7px;background:#121B33;color:#F6D88E;font-weight:800;font-size:14px}.tab.active{background:#1A2948}.tab-empty{margin-top:8px;height:calc(100% - 66px);border:1px solid rgba(201,160,78,.45);border-radius:7px;background:rgba(18,27,51,.55);display:grid;place-items:center;color:#A9B4D0;font-size:12px;text-align:center;padding:8px}.overlay{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(3,7,16,.78)}.overlay.open{display:flex}.dialog{position:relative;width:340px;min-height:190px;padding:24px;border:1px solid #C9A04E;border-radius:8px;background:#121B33;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.dialog h2{margin:0;font:900 18px Cinzel,Georgia,serif;color:#F6D88E}.dialog p{margin:0;color:#A9B4D0;font-size:14px}.dialog .close{right:2px;top:2px}.result-slots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.result-slots span{width:46px;height:58px;border:1px dashed #C9A04E;border-radius:6px;color:#F6D88E;font-size:12px;display:grid;place-items:center}.toast{position:absolute;z-index:5;bottom:7px;left:50%;transform:translateX(-50%);padding:6px 12px;border:1px solid #C9A04E;border-radius:999px;background:#121B33;color:#F4ECD8;font-size:13px;display:none}.toast.show{display:block}
</style>
</head>
<body>
<div id="wrap"><main id="scene" aria-label="Çağrı Otağı">
<a id="liste" href="../">← Liste</a>
<header class="top"><h1 class="title">ÇAĞRI OTAĞI</h1><div class="currency" aria-label="Altın miktarı">Altın <span>—</span></div><div class="currency" aria-label="Zümrüt miktarı">Zümrüt <span>—</span></div><button class="close" id="exit" aria-label="Kapat">×</button></header>
<section class="left" id="packs" aria-label="Paketler"></section>
<section class="center"><div class="select"><button class="pill active" data-count="1">Tekli</button><button class="pill" data-count="10">10'lu</button></div><button class="info" id="info" aria-label="Paket bilgisi">i</button><div class="chamber"><div class="visual"><strong>Görsel gerekli</strong><span>Otağ içi · 490×340</span></div></div><div class="details"><strong id="selected-name"></strong><span class="guarantee" id="guarantee"></span></div><button class="action" id="open"></button></section>
<aside class="right"><button class="tab active">Paketler</button><div class="tab-empty">Füzyon ve parça sistemleri</div></aside>
<div class="overlay" id="modal"><div class="dialog"><button class="close" data-close aria-label="Kapat">×</button><h2 id="modal-title"></h2><p id="modal-text"></p><div class="result-slots" id="results"></div><button class="pill" data-close>Kapat</button></div></div><div class="toast" id="toast" role="status"></div>
</main></div>
<script>
const packages=[
 {name:'Normal Paket',owned:'—',tiers:['Gümüş','Altın','İmparator'],price:100,currency:'Zümrüt'},
 {name:'Elite İmparator Paketi',owned:'—',tiers:['Gümüş','Altın','İmparator'],price:300,currency:'Zümrüt',counter:true},
 {name:'Altın Komutan Paketi',owned:'—',tiers:['Altın'],price:150,currency:'Zümrüt'},
 {name:'Gümüş Paket',owned:'—',tiers:['Bronz','Gümüş'],price:20000,currency:'Altın'},
 {name:'Medeniyet Elite Paketi',owned:'—',tiers:['Gümüş','Altın','İmparator'],price:null,currency:'Zümrüt'},
 {name:'Sınıf Elite Paketi',owned:'—',tiers:['Gümüş','Altın','İmparator'],price:null,currency:'Zümrüt'}
];
const packs=document.querySelector('#packs'), selectedName=document.querySelector('#selected-name'), guarantee=document.querySelector('#guarantee'), openButton=document.querySelector('#open'), modal=document.querySelector('#modal'), countButtons=[...document.querySelectorAll('[data-count]')];let selected=0,count=1;
function render(){packs.innerHTML=packages.map((p,i)=>`<button class="pack ${i===selected?'selected':''}" data-pack="${i}"><span class="slot"><b>Görsel<br>gerekli</b><span>56×48</span></span><span class="name">${p.name}</span><span class="owned">Sahip: ${p.owned}</span><span class="tiers">${p.tiers.map(t=>`<span class="${t==='Gümüş'?'silver':t==='Altın'?'gold':t==='İmparator'?'imperial':'bronze'}">${t}</span>`).join('')}</span></button>`).join('');packs.querySelectorAll('[data-pack]').forEach(b=>b.addEventListener('pointerup',()=>{selected=Number(b.dataset.pack);if(packages[selected].name==='Altın Komutan Paketi')count=1;update()}));selectedName.textContent=packages[selected].name;const p=packages[selected];guarantee.textContent=p.counter?'İmparator garantisi: ':'';if(p.counter){const b=document.createElement('b');b.textContent='— / 50';guarantee.append(b)}openButton.textContent=p.owned!=='—'?'Aç':p.price?`${count===10?p.price*9:p.price} ${p.currency} · ${count===10?'10’unu Aç':'Aç'}`:'Fiyat · Aç';countButtons[1].disabled=p.name==='Altın Komutan Paketi';countButtons.forEach(b=>b.classList.toggle('active',Number(b.dataset.count)===count))}
function update(){render()}
countButtons.forEach(b=>b.addEventListener('pointerup',()=>{if(!b.disabled){count=Number(b.dataset.count);update()}}));
openButton.addEventListener('pointerup',()=>{document.querySelector('#modal-title').textContent=count===10?'10 Komutan Özeti':'Çağrı Sonucu';document.querySelector('#modal-text').textContent='Komutan görseli ve sonucu için içerik gerekli.';document.querySelector('#results').innerHTML=Array.from({length:count},()=>'<span>Görsel gerekli<br>64×80</span>').join('');modal.classList.add('open')});
document.querySelector('#info').addEventListener('pointerup',()=>{document.querySelector('#modal-title').textContent=packages[selected].name;document.querySelector('#modal-text').textContent=packages[selected].counter?'50 çekilişte İmparator garantisi. Sayaç sezon geçişinde sıfırlanmaz.':'Paket oranları ve havuz içeriği oyun verisinden gösterilir.';document.querySelector('#results').innerHTML='';modal.classList.add('open')});
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('pointerup',()=>modal.classList.remove('open')));modal.addEventListener('pointerup',e=>{if(e.target===modal)modal.classList.remove('open')});document.querySelector('#exit').addEventListener('pointerup',()=>location.href='../');
function fit(){const s=Math.min(innerWidth/844,innerHeight/390);document.querySelector('#scene').style.transform=`scale(${s})`}addEventListener('resize',fit);fit();render();
</script>
</body>
</html>
