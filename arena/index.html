<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Arena · Warsigil</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Cinzel:wght@800;900&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e1c;color:#F4ECD8;font-family:'Barlow Semi Condensed',Arial,sans-serif}#stage{position:absolute;width:844px;height:390px;left:50%;top:50%;transform-origin:center;background:radial-gradient(ellipse at 50% 35%,#1b2944,#0B1224 68%);overflow:hidden;border:1px solid #443b2c}.gold{color:#F6D88E}.muted{color:#A9B4D0}.title{font:900 20px Cinzel,serif;letter-spacing:1px;color:#F6D88E}.panel{background:#121B33;border:1px solid #80673b;border-radius:7px}.pill{border:1px solid #C9A04E;border-radius:22px;background:#1b2740;color:#F4ECD8;font:700 14px 'Barlow Semi Condensed';min-height:44px;padding:0 15px;cursor:pointer}.pill.active,.pill.goldbtn{background:#8f6a29;color:#fff1c8}.icon{width:44px;height:44px;border:1px solid #C9A04E;border-radius:50%;background:#17233c;color:#F6D88E;font-size:18px;cursor:pointer}.x{position:absolute;right:8px;top:7px;width:44px;height:44px;border:0;background:none;color:#F4ECD8;font-size:24px;cursor:pointer}#liste{position:absolute;left:12px;top:8px;color:#F4ECD8;font-size:14px;z-index:3}.top{position:absolute;left:0;right:0;top:0;height:48px;padding:8px 62px;display:flex;justify-content:center;align-items:center;border-bottom:1px solid #6c5735;background:#0c1427}.curr{position:absolute;right:60px;top:10px;display:flex;gap:16px;font-size:14px}.rail{position:absolute;top:54px;left:12px;width:118px;bottom:12px;display:flex;flex-direction:column;gap:7px;padding:8px}.rail button{width:100%;padding:0 8px;font-size:13px}.rail .season{margin-top:auto;text-align:center;font-size:12px}.body{position:absolute;left:142px;right:14px;top:57px;bottom:12px}.map{height:100%;display:flex;align-items:center;justify-content:center;gap:26px}.mode{width:280px;height:260px;padding:18px;text-align:center;display:flex;align-items:center;flex-direction:column;justify-content:space-between}.crest{width:82px;height:82px;border:1px dashed #C9A04E;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#F6D88E}.mode h2{font:900 18px Cinzel;margin:0;color:#F6D88E}.mode p{margin:0;color:#A9B4D0;font-size:14px}.window{position:absolute;inset:0;background:rgba(5,9,18,.7);display:none;align-items:center;justify-content:center}.window.open{display:flex}.box{width:660px;height:316px;position:relative;padding:16px 18px}.box h2{margin:0 0 10px;font:900 18px Cinzel;color:#F6D88E}.tabs{display:flex;gap:7px;margin:4px 0 10px}.scroll{height:210px;overflow:auto;touch-action:pan-y}.row{min-height:54px;border-bottom:1px solid #34405a;display:flex;align-items:center;gap:10px;padding:5px;font-size:13px}.avatar{width:38px;height:38px;border:1px dashed #c9a04e;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#F6D88E;flex:none}.grow{flex:1}.small{font-size:12px;color:#A9B4D0}.score{color:#F6D88E;font-weight:800}.fight{background:#742b32;border-color:#c35c59}.rankcard{display:inline-flex;vertical-align:top;width:112px;height:170px;margin:6px;padding:12px;align-items:center;justify-content:space-between;flex-direction:column;text-align:center}.rankcard .crest{width:54px;height:54px}.sticky{position:absolute;bottom:9px;left:18px;right:18px;height:37px;background:#202b42;border:1px solid #C9A04E;border-radius:6px;display:flex;align-items:center;padding:0 10px;gap:12px;font-size:13px}

/* Audit group 4/5: touch controls and close button sizing */
#liste{left:8px!important;top:2px!important;min-width:64px;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;padding:0 7px!important;border:0!important;border-radius:0!important;background:transparent!important;text-shadow:none!important;opacity:1!important}
.x,.close{width:44px!important;height:44px!important;min-width:44px;min-height:44px;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;color:#F4ECD8!important;box-shadow:none!important}
</style></head><body><main id="stage"><a id="liste" href="../">← Liste</a><header class="top"><div class="title">ARENA</div><div class="curr"><span>▱ Arena Jetonu <b>—</b></span><span>Altın <b>—</b></span><span>Zümrüt <b>—</b></span></div></header><nav class="rail"><button class="pill" data-open="battle">Savaş</button><button class="pill" data-open="record">Savaş Kaydı</button><button class="pill" data-open="defense">Savunma</button><button class="pill" data-open="leagues">Ligler</button><button class="pill" data-open="leaders">Sıralama</button><div class="season muted">Sezon sonu<br>—</div></nav>
<section class="body"><div class="map"><article class="mode panel"><div class="crest">Görsel gerekli</div><h2>ZAFER ZİNCİRİ</h2><p>Arena · Asenkron savaş</p><button class="pill goldbtn" data-open="battle">Aç</button></article><article class="mode panel"><div class="crest">Görsel gerekli</div><h2>SIRALAMA ARENASI</h2><p>Zafer Puanı · Ligler</p><button class="pill" data-open="battle">Aç</button></article></div></section>
<div class="window" id="window"><section class="box panel"><button class="x" id="close" aria-label="Kapat">×</button><h2 id="heading">SAVAŞ</h2><div class="tabs"><button class="pill active" data-open="battle">Savaş</button><button class="pill" data-open="record">Savaş Kaydı</button><button class="pill" data-open="defense">Savunma</button><button class="pill" data-open="leagues">Ligler</button><button class="pill" data-open="leaders">Sıralama</button></div><div id="content" class="scroll"></div></section></div>
</main><script>
(()=>{const stage=document.getElementById('stage'),overlay=document.getElementById('window'),content=document.getElementById('content'),heading=document.getElementById('heading');function fit(){const s=Math.min(innerWidth/844,innerHeight/390);stage.style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fit);fit();const titles={battle:'SAVAŞ · RAKİPLER',record:'SAVAŞ KAYDI',defense:'SAVUNMA KADROSU',leagues:'LİGLER',leaders:'SIRALAMA ARENASI'};function show(k){heading.textContent=titles[k];overlay.classList.add('open');document.querySelectorAll('.tabs .pill').forEach(b=>b.classList.toggle('active',b.dataset.open===k));if(k==='battle')content.innerHTML=`<div class="row"><div class="grow"><b>Mevcut Lig</b> · Er III <span class="small">Zafer Puanı —</span></div><div class="score">Lig ilerlemesi —</div></div><div class="row"><div class="grow">Yeni Rakipler Edin</div><button class="pill" id="refresh">Listeyi Yenile</button></div>${['Rakip A','Rakip B','Rakip C'].map((n,i)=>`<div class="row"><div class="avatar">Görsel gerekli</div><div class="grow"><b>${n}</b><div class="small">Sv. — · Zafer Puanı —</div></div><span class="small">Rakip kadrosu: 5 komutan · Kadro Gücü —</span><button class="pill fight">Savaş</button></div>`).join('')}`;else if(k==='record')content.innerHTML=`<div class="tabs"><button class="pill active">Savunma</button><button class="pill">Saldırı</button></div>${['Rakip A','Rakip B','Rakip C'].map(n=>`<div class="row"><div class="avatar">Görsel gerekli</div><div class="grow"><b>${n}</b><div class="small">Kadro Gücü — · — önce</div></div><span>Zafer Puanı —</span><b class="gold">Sonuç —</b></div>`).join('')}`;else if(k==='defense')content.innerHTML=`<div class="row">${Array.from({length:5},(_,i)=>`<div class="grow" style="text-align:center"><div class="crest" style="margin:auto">Görsel gerekli</div><b>Komutan ${i+1}</b><div class="small">Kadro yuvası</div></div>`).join('')}</div><div class="row"><b>Başkomutan</b><span class="grow">Medeniyet bonusu —</span><b>Kadro Gücü —</b><button class="pill goldbtn">Düzenle</button></div>`;else if(k==='leagues')content.innerHTML=`<div class="scroll">${['Er','Onbaşı','Çavuş','Teğmen','Yüzbaşı','Binbaşı','Yarbay','Albay','General','Mareşal'].map((n,i)=>`<article class="rankcard panel"><div class="crest">Görsel gerekli</div><b>${n}${i<9?' III':' '}</b><span class="small">Zafer Puanı —</span><span class="small">Haftalık ödül —</span></article>`).join('')}</div>`;else content.innerHTML=`${Array.from({length:8},(_,i)=>`<div class="row"><b style="width:40px">${i+1}</b><div class="avatar">Görsel gerekli</div><div class="grow"><b>${['Mareşal','General','Albay','Yarbay','Binbaşı','Yüzbaşı','Teğmen','Çavuş'][i]}</b><div class="small">İttifak —</div></div><span>Zafer Puanı —</span><span>Kadro Gücü —</span></div>`).join('')}<div class="sticky"><b>Siz</b><span class="grow">Sıra — · Zafer Puanı —</span><button class="pill">Dünya Sıralaması</button></div>`}
document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('pointerdown',e=>{e.stopPropagation();show(b.dataset.open)}));document.getElementById('close').addEventListener('pointerdown',()=>overlay.classList.remove('open'));overlay.addEventListener('pointerdown',e=>{if(e.target===overlay)overlay.classList.remove('open')});content.addEventListener('pointerdown',e=>{if(e.target.id==='refresh')show('battle')});})();
</script></body></html>
