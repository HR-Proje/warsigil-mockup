<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1224">
<title>Warsigil · Görevler</title>
<style>
:root{--bg:#0B1224;--panel:#121B33;--edge:#C9A04E;--title:#F6D88E;--text:#F4ECD8;--muted:#A9B4D0;--green:#1C805B;--blue:#263B66}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Barlow Semi Condensed",Arial,sans-serif;touch-action:manipulation}#fit{position:absolute;left:50%;top:50%;width:844px;height:390px;transform-origin:center;overflow:hidden;background:radial-gradient(ellipse at 65% 45%,#182442 0%,var(--bg) 75%)}
#liste{position:absolute;z-index:5;left:8px;top:0;min-width:64px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--text);font-size:12px;text-decoration:none;border-radius:999px;background:#121B33;border:1px solid #584926}
.top{position:absolute;left:0;right:0;top:0;height:44px;background:#10182c;border-bottom:1px solid #72582b;display:flex;align-items:center;padding:0 54px 0 74px}.title{font:900 19px/1 Cinzel,Georgia,serif;letter-spacing:.06em;color:var(--title);text-shadow:1px 1px #000}.resources{margin-left:auto;display:flex;gap:7px;align-items:center}.pill{height:25px;min-width:74px;padding:0 10px;border:1px solid #715b31;border-radius:999px;background:#18233d;color:var(--text);font-size:12px;display:flex;align-items:center;justify-content:center;text-shadow:1px 1px #000}.close{position:absolute;right:4px;top:0;width:44px;height:44px;border:0;background:transparent;color:var(--text);font:400 27px/1 Arial;cursor:pointer}
.rail{position:absolute;left:10px;top:43px;width:157px;display:flex;flex-direction:column;gap:5px}.tab{height:55px;width:157px;border:1px solid #756033;border-radius:7px;background:linear-gradient(100deg,#172543,#111a2e);color:var(--muted);font:700 15px "Barlow Semi Condensed",Arial;display:flex;align-items:center;text-align:left;padding:0 10px;gap:10px;cursor:pointer;position:relative}.tab .badge{width:31px;height:31px;border:1px solid #79643a;border-radius:50%;display:grid;place-items:center;color:var(--title);font:800 13px Cinzel,serif}.tab.active{border-color:#e0b85d;background:linear-gradient(100deg,#263b66,#172442);color:var(--title);box-shadow:inset 0 0 0 1px #493d2a}.tab.active:after{content:"›";position:absolute;right:8px;color:var(--title);font-size:22px;line-height:1}.tab.empty{visibility:hidden;pointer-events:none}
.main{position:absolute;left:177px;right:10px;top:43px;height:337px;border:1px solid #786238;border-radius:7px;background:rgba(18,27,51,.9);overflow:hidden}.summary{height:79px;border-bottom:1px solid #69552f;display:flex;align-items:center;padding:8px 12px;gap:10px;background:linear-gradient(100deg,#182744,#121b33)}.art{width:54px;height:54px;flex:none;border:1px dashed #9c8149;border-radius:6px;color:var(--muted);display:grid;place-items:center;text-align:center;font-size:12px;line-height:1.05}.sumcopy{min-width:140px;flex:1}.sumtitle{font-weight:800;font-size:16px;color:var(--text);line-height:18px}.meter{height:14px;margin-top:5px;border:1px solid #aa8a4b;border-radius:999px;background:#080e1c;overflow:hidden}.meter i{display:block;width:0;height:100%;background:#4f815b}.sub{font-size:12px;color:#FFB547;margin-top:3px}.reward{width:47px;height:47px;border:1px dashed #8d7645;border-radius:6px;display:grid;place-items:center;text-align:center;font-size:12px;line-height:1.05;color:var(--muted)}.take{height:44px;min-width:90px;padding:0 16px;border:1px solid #8a7240;border-radius:999px;background:#28334b;color:#7e8799;font:800 14px "Barlow Semi Condensed";cursor:pointer}.take.ready{background:var(--green);border-color:#67b88d;color:white}
.list{position:absolute;top:84px;left:7px;right:7px;bottom:48px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#806a3c #10182c}.row{min-height:61px;margin:4px 0;padding:6px 8px;border:1px solid #786238;border-radius:7px;background:#17233d;display:flex;align-items:center;gap:8px}.rowcopy{min-width:0;flex:1}.task{font-size:14px;line-height:16px;font-weight:700}.progress{height:9px;width:min(100%,210px);margin-top:5px;border:1px solid #52607c;border-radius:999px;background:#0a1120;overflow:hidden}.progress i{display:block;height:100%;width:var(--p,0%);background:#728b68;border-radius:999px}.state{font-size:12px;color:var(--muted);margin-top:2px}.loot{width:44px;height:44px;flex:none;border:1px dashed #897348;border-radius:5px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12px;line-height:1}.go{width:80px;height:44px;flex:none;border:1px solid #9c8149;border-radius:999px;background:var(--blue);color:var(--text);font:800 13px "Barlow Semi Condensed";cursor:pointer}.go.claim{background:#876321;color:#fff1c9}.bottom{position:absolute;left:7px;right:7px;bottom:0;height:44px;border-top:1px solid #57492e;display:flex;align-items:center;justify-content:flex-end;padding-right:5px}.all{height:44px;padding:0 18px;border:1px solid #9c8149;border-radius:999px;background:#6e5428;color:var(--title);font:800 13px "Barlow Semi Condensed";cursor:pointer}.toast{position:absolute;z-index:4;left:50%;bottom:49px;transform:translateX(-50%);padding:6px 13px;border:1px solid var(--edge);border-radius:999px;background:#18233d;color:var(--text);font-size:12px;display:none}.toast.show{display:block}
button{touch-action:manipulation}button:active{filter:brightness(1.2)}@media(max-aspect-ratio:844/390){#fit{transform:translate(-50%,-50%) scale(min(calc(100vw / 844),calc(100vh / 390)))}}@media(min-aspect-ratio:844/390){#fit{transform:translate(-50%,-50%) scale(min(calc(100vw / 844),calc(100vh / 390)))}}
</style>
</head>
<body><div id="fit">
<a id="liste" href="../">← Liste</a>
<header class="top"><div class="title">GÖREVLER</div><div class="resources"><span class="pill">Altın</span><span class="pill">Zümrüt</span></div><button class="close" aria-label="Kapat" onclick="location.href='../ana-ekran/'">×</button></header>
<nav class="rail" aria-label="Görev sekmeleri">
<button class="tab active" data-tab="gunluk"><span class="badge">G</span>Günlük</button>
<button class="tab" data-tab="haftalik"><span class="badge">H</span>Haftalık</button>
<button class="tab empty" aria-hidden="true" tabindex="-1"></button>
<button class="tab" data-tab="ilerleme"><span class="badge">İ</span>İlerleme</button>
<button class="tab" data-tab="basarim"><span class="badge">B</span>Başarımlar</button>
</nav>
<main class="main"><section class="summary"><div class="art" id="heroArt">Görsel gerekli<br>54×54</div><div class="sumcopy"><div class="sumtitle" id="sumtitle">Tüm günlük görevleri tamamla</div><div class="meter"><i id="totalFill"></i></div><div class="sub" id="sub">Günlük görevler · UTC gece yarısı yenilenir</div></div><div class="reward">Ödül<br>Görsel gerekli</div><div class="reward">Ödül<br>Görsel gerekli</div><button class="take" id="sumTake" disabled>Al</button></section>
<section class="list" id="rows" aria-live="polite"></section><footer class="bottom"><button class="all" id="all">Hepsini Al</button></footer></main><div class="toast" id="toast" role="status"></div>
</div>
<script>
const data={
 gunluk:{title:'Tüm günlük görevleri tamamla',sub:'20 görev · UTC gece yarısı yenilenir',art:'Görsel gerekli<br>54×54',rows:[['3 Kule savaşı kazan','İlerlemen sürüyor','0%','Git'],['Arena saldırısı yap','Günlük görev','0%','Git'],['Görev ödülünü topla','Günlük görev','0%','Git'],['Bir komutanın yeteneğini geliştir','Günlük görev','0%','Git']]},
 haftalik:{title:'Tüm haftalık görevleri tamamla',sub:'Haftalık görevler · Pazartesi sıfırlanır',art:'Görsel gerekli<br>54×54',rows:[['Kuşatma hakkı kullan','Haftalık görev','0%','Git'],['Kule’de kat geç','Haftalık görev','0%','Git'],['Pazar’dan alışveriş yap','Haftalık görev','0%','Git'],['Fetih Yarışı puanı kazan','Haftalık görev','0%','Git']]},
 ilerleme:{title:'İlerleme vazifeleri',sub:'Sıralı görev zinciri · zincir sonu ödülü: Altın komutan',art:'Görsel gerekli<br>54×54',rows:[['Sıradaki vazife','Görev zinciri','0%','Git'],['Görev koşulları','Ayrıntı için seç','0%','Aç'],['Zincir ödülü','Altın komutan','0%','Aç']]},
 basarim:{title:'Başarımlar',sub:'Tek seferlik hedefler · tamamlanınca Zümrüt',art:'Görsel gerekli<br>54×54',rows:[['Koleksiyon','Başarım kategorisi','0%','Aç'],['İlerleme','Başarım kategorisi','0%','Aç'],['Savaş','Başarım kategorisi','0%','Aç'],['Ekonomi · Ustalık','Başarım kategorileri','0%','Aç']]}
};
const rows=document.getElementById('rows'),toast=document.getElementById('toast');let active='gunluk',toastTimer;
function flash(s){toast.textContent=s;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1500)}
function render(key){active=key;document.querySelectorAll('.tab[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===key));const d=data[key];document.getElementById('sumtitle').textContent=d.title;document.getElementById('sub').textContent=d.sub;document.getElementById('heroArt').innerHTML=d.art;rows.innerHTML='';d.rows.forEach((r,i)=>{const row=document.createElement('article');row.className='row';row.innerHTML='<div class="rowcopy"><div class="task"></div><div class="progress"><i></i></div><div class="state"></div></div><div class="loot">Görsel<br>gerekli</div><div class="loot">Ödül<br>gerekli</div><button class="go"></button>';row.querySelector('.task').textContent=r[0];row.querySelector('.state').textContent=r[1];row.querySelector('.progress i').style.width=r[2];const b=row.querySelector('.go');b.textContent=r[3];b.addEventListener('click',()=>flash(r[3]==='Git'?'İlgili görev ekranı':'Görev ayrıntısı'));rows.appendChild(row)});document.getElementById('totalFill').style.width='0%'}
document.querySelectorAll('.tab[data-tab]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.tab)));document.getElementById('all').addEventListener('click',()=>flash('Alınabilir ödül yok'));document.getElementById('sumTake').addEventListener('click',()=>flash('Alınabilir ödül yok'));
function fit(){const s=Math.min(innerWidth/844,innerHeight/390);document.getElementById('fit').style.transform='translate(-50%,-50%) scale('+s+')'}addEventListener('resize',fit);fit();render('gunluk');
</script></body></html>
