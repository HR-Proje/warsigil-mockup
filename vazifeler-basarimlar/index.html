<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1224">
<title>Warsigil · İlerleme Vazifeleri ve Başarımlar</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0B1224;color:#F4ECD8;font-family:'Barlow Semi Condensed',sans-serif}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}#fit{position:absolute;inset:0;overflow:hidden}#stage{position:absolute;left:0;top:0;width:844px;height:390px;transform-origin:top left;background:radial-gradient(ellipse at 55% 40%,#182443 0,#0B1224 78%)}#liste{display:flex;align-items:center;justify-content:center;min-width:44px;height:44px;position:absolute;left:10px;top:5px;z-index:5;color:#F4ECD8;font-size:12px;text-decoration:none;padding:3px 7px;border-radius:999px;background:rgba(11,18,36,.8)}.panel{position:absolute;left:42px;right:18px;top:17px;bottom:14px;border:1px solid #C9A04E;border-radius:8px;background:#121B33;box-shadow:0 12px 36px #050912aa;overflow:hidden}.head{height:43px;display:flex;align-items:center;padding:0 15px;border-bottom:1px solid #765b2e;background:#10182c}.title{font:900 19px/1 'Cinzel',Georgia,serif;letter-spacing:.06em;color:#F6D88E;text-transform:uppercase}.close{margin-left:auto;width:44px;height:44px;border:0;background:transparent;color:#F4ECD8;font:500 28px/1 Arial,sans-serif}.tabs{position:absolute;left:0;top:43px;bottom:0;width:165px;padding:9px 8px;border-right:1px solid #796031;display:flex;flex-direction:column;gap:7px}.tab{position:relative;min-height:50px;text-align:left;padding:0 10px;border:1px solid #574b36;border-radius:7px;background:#17223b;font-size:15px;font-weight:700;color:#A9B4D0}.tab.active{border-color:#C9A04E;background:#28314a;color:#F6D88E}.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#C83D45;margin-right:7px;vertical-align:2px}.content{position:absolute;left:165px;right:0;top:43px;bottom:0;padding:9px 11px 46px;overflow:hidden}.summary{height:70px;border:1px solid #836632;border-radius:7px;background:#192741;padding:7px 10px;display:flex;align-items:center;gap:10px}.summary .summaryText{min-width:0;flex:1}.summary h2{margin:0 0 5px;color:#F6D88E;font-size:16px;line-height:18px}.muted{color:#A9B4D0;font-size:12px}.bar{height:8px;border:1px solid #766039;border-radius:99px;background:#0B1224;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:0;background:#C9A04E;border-radius:99px}.timer{color:#FFB547;font-weight:700;font-size:12px;white-space:nowrap}.reward{width:56px;text-align:center;color:#A9B4D0;font-size:10px}.slot{width:56px;height:44px;margin:0 auto 2px;border:1px dashed #A9B4D0;border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;line-height:13px;color:#A9B4D0}.take{height:44px;min-width:76px;padding:0 15px;border:1px solid #C9A04E;border-radius:999px;background:#6e5528;color:#F6D88E;font-weight:800;font-size:14px}.take:disabled{opacity:.48}.rows{position:absolute;left:11px;right:11px;top:88px;bottom:48px;overflow:auto;display:flex;flex-direction:column;gap:7px;touch-action:pan-y;scrollbar-color:#78613a #10182c}.row{min-height:62px;border:1px solid #78613a;border-radius:7px;background:#17243b;display:flex;align-items:center;padding:6px 8px;gap:9px}.rowmain{flex:1;min-width:0}.rowtitle{font-size:14px;font-weight:700;line-height:17px}.progress{margin-top:3px;display:flex;align-items:center;gap:7px;color:#A9B4D0;font-size:12px}.progress .bar{margin:0;width:130px;height:6px}.rowrewards{display:flex;gap:2px}.rowrewards .reward{width:40px}.rowrewards .slot{width:56px;height:44px;font-size:12px}.pill{height:44px;min-width:65px;padding:0 12px;border:1px solid #8a6930;border-radius:999px;background:#26314a;color:#F6D88E;font-weight:800;font-size:13px}.pill.go{border-color:#57779b;background:#243c59;color:#D6E8FF}.footer{position:absolute;left:165px;right:0;bottom:0;height:48px;border-top:1px solid #78613a;background:#10182c;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;gap:10px}.footer .label{margin-right:auto;color:#F6D88E;font-weight:700;font-size:13px}.bulk{height:44px;padding:0 19px;border:1px solid #C9A04E;border-radius:999px;background:#695126;color:#F6D88E;font-weight:800}.category{position:absolute;top:8px;right:12px;display:flex;gap:5px}.cat{height:44px;padding:0 12px;border:1px solid #675333;border-radius:999px;background:#17243b;color:#A9B4D0;font-size:12px;font-weight:700}.cat.active{color:#F6D88E;border-color:#C9A04E}.achievements .summary{display:none}.achievements .rows{top:48px}.achievements .footer{display:none}.chain .summary{height:70px}.chain .row{min-height:62px}.chain .rows{top:88px}.empty{height:100%;display:flex;align-items:center;justify-content:center;color:#A9B4D0;font-size:14px}.hidden{display:none!important}@media(orientation:portrait){#stage{visibility:hidden}}
</style>
</head>
<body><div id="fit"><main id="stage"><a id="liste" href="../">← Liste</a><section class="panel" aria-label="İlerleme Vazifeleri ve Başarımlar"><header class="head"><div class="title">Görevler</div><button class="close" type="button" aria-label="Kapat" id="close">×</button></header><nav class="tabs" aria-label="Görev ve başarım sekmeleri"><button class="tab active" data-tab="daily"><span class="dot"></span>Günlük</button><button class="tab" data-tab="weekly">Haftalık</button><button class="tab" data-tab="progress">İlerleme</button><button class="tab" data-tab="achievements">Başarımlar</button></nav><section class="content" id="content"><div class="summary" id="summary"><div class="summaryText"><h2 id="summaryTitle">Tüm Günlük Görevleri Tamamla</h2><span class="muted" id="summaryCount">Toplu ödül</span><div class="bar"><i></i></div></div><div class="timer" id="timer">Yenilenme: UTC</div><div class="reward"><span class="slot">Görsel<br>gerekli</span>Ödül</div><button class="take" disabled>Al</button></div><div class="category hidden" id="categories"></div><div class="rows" id="rows"></div></section><footer class="footer" id="footer"><span class="label">Alınabilir ödüller</span><button class="bulk" id="bulk">Hepsini Al</button></footer></section></main></div>
<script>
(function(){
  'use strict';
  var stage=document.getElementById('stage'), rows=document.getElementById('rows'), tabs=[].slice.call(document.querySelectorAll('.tab')), cats=document.getElementById('categories'), active='daily', category='Koleksiyon';
  var achievementGroups={
    'Koleksiyon':['İlk Altın komutanını edin','Her medeniyetten bir komutan topla','İlk F10 komutanını elde et'],
    'İlerleme':['Medeniyet Kulesi’nde yeni bir kata ulaş','Bir medeniyetin Hikaye bölümünü tamamla','Çift Kule’yi tamamla'],
    'Savaş':['İlk Arena zaferini kazan','Meydan Okuma’da Kadim’i tamamla','Savaş zaferlerinde yeni kilometre taşına ulaş'],
    'Ekonomi':['Toplam Altın harcamasında yeni kilometre taşına ulaş','Sezon Bileti’ni tamamla'],
    'Ustalık':['Üç sınıftan komutanları F10 yap','Üç formasyon şablonunu kullan','Üç formasyon türüyle savaş kazan']
  };
  var taskData={
    daily:{title:'Tüm Günlük Görevleri Tamamla',count:'Görevler · örnek liste',timer:'Yenilenme: UTC',items:[['Arena savaşı yap','İlerleme sürüyor','Zümrüt','Tecrübe'],['Kule’de kat geç','İlerleme sürüyor','Altın','Tecrübe'],['Bir komutanın becerisini geliştir','İlerleme sürüyor','Zümrüt','Tecrübe'],['Görev Modu ödülünü topla','İlerleme sürüyor','Altın','Tecrübe']]},
    weekly:{title:'Haftalık görevler',count:'Haftalık görev listesi',timer:'Yenilenme: Pazartesi',items:[['Günlük görevleri tamamla','İlerleme sürüyor','Sezon Puanı','Tecrübe'],['Bir komutanı geliştir','İlerleme sürüyor','Altın','Tecrübe'],['Kuşatma hakkını kullan','İlerleme sürüyor','Madalya','Tecrübe']]},
    progress:{title:'İlerleme Vazifeleri',count:'Görev zinciri · mevcut adım',timer:'Zincir sonu ödülü',items:[['İlk adım','Görev zinciri','Altın','Zümrüt'],['Sonraki adım','Kilitli','Altın','Tecrübe'],['Zincirin sonu','Kilitli','Altın komutan','']]}
  };
  function fit(){var s=Math.min(innerWidth/844,innerHeight/390);stage.style.transform='translate('+((innerWidth-844*s)/2)+'px,'+((innerHeight-390*s)/2)+'px) scale('+s+')'}
  function slot(label){return '<span class="reward"><span class="slot">Görsel<br>gerekli</span>'+label+'</span>'}
  function render(){
    var achievement=active==='achievements';document.getElementById('content').classList.toggle('achievements',achievement);document.getElementById('content').classList.toggle('chain',active==='progress');document.getElementById('summary').classList.toggle('hidden',achievement);document.getElementById('footer').classList.toggle('hidden',achievement);cats.classList.toggle('hidden',!achievement);rows.innerHTML='';
    if(achievement){document.getElementById('summaryTitle').textContent='Başarımlar';document.getElementById('summaryCount').textContent='Tek seferlik Zümrüt ödülleri';document.getElementById('timer').textContent='';cats.innerHTML=Object.keys(achievementGroups).map(function(k){return '<button class="cat '+(k===category?'active':'')+'" data-category="'+k+'">'+k+'</button>'}).join('');achievementGroups[category].forEach(function(t){addRow(t,'Tamamlanma durumu', ['Zümrüt'], 'İncele')});cats.querySelectorAll('.cat').forEach(function(b){b.addEventListener('click',function(){category=b.dataset.category;render()})});return}
    var data=taskData[active];document.getElementById('summaryTitle').textContent=data.title;document.getElementById('summaryCount').textContent=data.count;document.getElementById('timer').textContent=data.timer;data.items.forEach(function(item,i){addRow(item[0],item[1],item.slice(2),active==='progress'&&i>0?'Kilitli':active==='progress'?'Aç':'Git')});
  }
  function addRow(title,progress,rewards,action){var el=document.createElement('article');el.className='row';el.innerHTML='<div class="rowmain"><div class="rowtitle"></div><div class="progress"><span></span><span class="bar"><i></i></span></div></div><div class="rowrewards"></div><button class="pill '+(action==='Git'?'go':'')+'" type="button"></button>';el.querySelector('.rowtitle').textContent=title;el.querySelector('.progress>span').textContent=progress;el.querySelector('.progress .bar').style.display=active==='achievements'?'none':'';el.querySelector('.rowrewards').innerHTML=rewards.filter(Boolean).map(slot).join('');var b=el.querySelector('button');b.textContent=action;b.disabled=action==='Kilitli';b.addEventListener('click',function(){if(action==='Git'){b.textContent='Açıldı';b.disabled=true}else if(action==='Aç'){b.textContent='Alındı';b.disabled=true}else if(action==='İncele'){b.textContent='Takipte';b.disabled=true}});rows.appendChild(el)}
  tabs.forEach(function(b){b.addEventListener('click',function(){active=b.dataset.tab;tabs.forEach(function(t){t.classList.toggle('active',t===b)});render()})});document.getElementById('bulk').addEventListener('click',function(){this.textContent='Alındı';this.disabled=true});document.getElementById('close').addEventListener('click',function(){location.href='../'});window.addEventListener('resize',fit);window.addEventListener('orientationchange',fit);fit();render();
})();
</script></body></html>
