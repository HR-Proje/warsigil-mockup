<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B1224">
<title>Warsigil · Komutan Dizini</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0B1224;color:#F4ECD8;font-family:'Barlow Semi Condensed',system-ui,sans-serif}#fit{position:absolute;inset:0;display:grid;place-items:center}#stage{width:844px;height:390px;position:relative;overflow:hidden;transform-origin:center;background:radial-gradient(ellipse at 50% 0%,#1a294a,#0B1224 72%)}button,input{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}.title{position:absolute;left:54px;top:11px;color:#F6D88E;font:900 19px/24px Cinzel,serif;letter-spacing:.06em}.sub{position:absolute;left:55px;top:37px;color:#A9B4D0;font-size:13px}.bar{position:absolute;left:0;right:0;top:0;height:55px;border-bottom:1px solid #6B4E1C;background:linear-gradient(#121B33,#0B1224)}#liste{position:absolute;z-index:4;left:12px;top:7px;color:#F4ECD8;text-decoration:none;font-size:13px;padding:7px 8px;min-height:32px}.x{position:absolute;right:7px;top:5px;width:44px;height:44px;border:0;background:transparent;color:#F4ECD8;font-size:28px;line-height:1}.circle{border:1px solid #C9A04E;background:#172441;border-radius:50%;width:44px;height:44px}.pill{border:1px solid #C9A04E;background:#172441;border-radius:999px;min-height:40px;padding:0 16px}.pill.active{background:#C9A04E;color:#0B1224}.panel{background:#121B33;border:1px solid #C9A04E;border-radius:7px}.scroll{overflow:auto;scrollbar-color:#C9A04E #121B33;scrollbar-width:thin;touch-action:pan-y}.section{position:absolute;left:18px;right:18px;top:68px;bottom:12px}.section-head{height:36px;display:flex;align-items:center;gap:10px}.section-head h2{margin:0;color:#F6D88E;font:800 15px Cinzel,serif;letter-spacing:.04em}.filterbtn{position:absolute;right:0;top:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:4px 2px 14px}.civ{height:124px;position:relative;padding:8px;text-align:center}.civ .art{width:68px;height:70px;margin:0 auto 5px}.slot{border:1px dashed #A9B4D0;border-radius:6px;display:grid;place-items:center;text-align:center;color:#A9B4D0;font-size:12px;line-height:1.15;padding:4px}.civ strong,.comm strong{display:block;font-size:14px}.count{position:absolute;right:6px;top:5px;border-radius:999px;background:#0B1224;border:1px solid #C9A04E;color:#F6D88E;padding:2px 7px;font-size:12px}.tier{margin:4px 0 10px}.tier h3{margin:4px 2px 7px;color:#F6D88E;font:800 13px Cinzel,serif;border-bottom:1px solid #26355F;padding-bottom:4px}.cards{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.comm{height:122px;text-align:center;padding:5px;position:relative}.comm .portrait{height:78px;width:100%;margin-bottom:4px}.comm.dim{opacity:.48}.role{font-size:12px;color:#C9A04E}.back{position:absolute;left:0;top:0;width:46px;height:36px;border:0;background:none;color:#F4ECD8;font-size:20px}.overlay{position:absolute;inset:0;background:rgba(4,8,18,.78);display:grid;place-items:center;z-index:8}.dialog{width:440px;max-height:330px;position:relative;padding:18px}.dialog h2{margin:0 48px 12px 0;color:#F6D88E;font:800 17px Cinzel,serif}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.fields label{font-size:13px;color:#A9B4D0}.fields select,.fields input{width:100%;height:38px;background:#0B1224;border:1px solid #6B4E1C;border-radius:6px;padding:5px 8px}.accord{width:100%;text-align:left;margin:3px 0;min-height:36px}.dialog-foot{display:flex;justify-content:space-between;margin-top:12px}.detail{position:absolute;inset:55px 0 0;display:grid;grid-template-columns:1fr 300px;gap:10px;padding:10px 14px}.hero{position:relative;display:grid;grid-template-columns:45px 1fr 45px;align-items:center;text-align:center}.hero .full{height:220px;width:170px;margin:auto}.hero h2{position:absolute;top:0;left:55px;margin:0;color:#F6D88E;font:800 17px Cinzel,serif}.hero .story{position:absolute;left:0;bottom:2px;display:flex;gap:8px}.sidepanel{padding:10px;overflow:hidden}.tabs{display:flex;gap:5px}.tabs button{flex:1;padding:0 5px;font-size:13px}.stats{display:grid;grid-template-columns:1fr auto;gap:5px;padding-top:8px;font-size:13px}.stats span:nth-child(odd){color:#A9B4D0}.skillrow{display:flex;gap:8px;margin:12px 0}.skill{width:44px;height:44px;border-radius:50%;border:1px dashed #C9A04E;display:grid;place-items:center;color:#F6D88E}.hidden{display:none!important}
</style></head><body><div id="fit"><main id="stage"><header class="bar"><a id="liste" href="../">← Liste</a><div class="title">KOMUTAN DİZİNİ</div><div class="sub" id="crumb">Medeniyetler</div><button class="x" id="close" aria-label="Kapat">×</button></header><section id="home" class="section"><div class="section-head"><h2>MEDENİYETLER</h2><button id="filterOpen" class="pill filterbtn">Filtre</button></div><div id="civs" class="scroll" style="position:absolute;inset:38px 0 0"></div></section><section id="nation" class="section hidden"><button class="back" id="backNation" aria-label="Geri">‹</button><div class="section-head" style="padding-left:40px"><h2 id="nationTitle">TÜRK</h2><button id="info" class="circle" aria-label="Bilgi">i</button></div><div id="commanderList" class="scroll" style="position:absolute;inset:40px 0 0"></div></section><section id="profile" class="detail hidden"><div class="hero"><h2 id="profileName">Komutan</h2><button id="prev" class="circle" aria-label="Önceki">‹</button><div><div class="slot full">Görsel gerekli<br>170 × 220 px</div><div class="story"><button class="pill" id="history">Tarihçe</button><button class="circle" id="commInfo" aria-label="Komutan bilgisi">i</button></div></div><button id="next" class="circle" aria-label="Sonraki">›</button></div><aside class="sidepanel panel"><div class="tabs"><button class="pill active" data-tab="ability">Yetenek</button><button class="pill" data-tab="costume">Kostümler</button></div><div id="ability"><div class="skillrow"><div class="skill">Y1</div><div class="skill">Y2</div><div class="skill">Y3</div><div class="skill">F10</div></div><strong>Medeniyet Bonusu</strong><div class="stats"><span>Can</span><b>—</b><span>Saldırı</span><b>—</b><span>Savunma</span><b>—</b><span>Öfke Kazanımı</span><b>—</b><span>Hasar Azaltma</span><b>—</b><span>Zırh Kırma</span><b>—</b></div><hr><b>TOPLAM İSTATİSTİKLER · SV 60 / F10</b></div><div id="costume" class="hidden"><div class="slot" style="height:170px;margin-top:12px">Görsel gerekli<br>kostüm önizleme</div></div></aside></section><div id="modal" class="overlay hidden"><div class="dialog panel"><button class="x" id="modalX" aria-label="Kapat">×</button><h2 id="modalTitle">FİLTRE</h2><div id="modalBody"></div></div></div></main></div>
<script>
(function(){
'use strict';
var stage=document.getElementById('stage');function fit(){var s=Math.min(innerWidth/844,innerHeight/390);stage.style.transform='scale('+s+')'}addEventListener('resize',fit);fit();
var civNames=['Türk','Roma','Yunan','Pers','Çin','Moğol','Arap','Alman','Viking','Fransız','İngiliz','Japon','Medeniyetsiz'];
var bronze=['Kalkan Nöbetçisi','Demir Duvar','Siper Muhafızı','Azimli Er','Keskin Nişancı','Alev Okçusu','Zırh Delen','Hızlı Kılıç','Gölge Süvari','Kasırga Atlısı'];
var roster={'Medeniyetsiz':bronze,'Türk':['Mete Han','Bilge Kağan','Alparslan','Timur','Osman Gazi','Fatih Sultan Mehmet','Kanuni Sultan Süleyman']};
var civRoot=document.getElementById('civs'), nation=document.getElementById('nation'), home=document.getElementById('home'), profile=document.getElementById('profile'), modal=document.getElementById('modal'),currentCiv='Türk',currentList=[],selected=0;
function esc(s){return s.replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function renderCivs(filter){var list=civNames.filter(function(n){return !filter||n.toLocaleLowerCase('tr').includes(filter.toLocaleLowerCase('tr'))});civRoot.innerHTML='<div class="panel" style="padding:10px;height:100%"><div style="display:flex;justify-content:space-between;color:#A9B4D0;margin-bottom:8px"><b>Medeniyetler</b><span> sahip olunan / toplam</span></div><div class="grid">'+list.map(function(n){return '<button class="civ panel" data-civ="'+esc(n)+'"><span class="count">— / —</span><span class="slot art">Görsel gerekli<br>64 × 70 px</span><strong>'+esc(n)+'</strong></button>'}).join('')+'</div></div>';civRoot.querySelectorAll('[data-civ]').forEach(function(b){b.addEventListener('pointerup',function(){openNation(b.dataset.civ)})})}
function openNation(name){currentCiv=name;document.getElementById('nationTitle').textContent=name.toLocaleUpperCase('tr');home.classList.add('hidden');profile.classList.add('hidden');nation.classList.remove('hidden');document.getElementById('crumb').textContent=name;var names=roster[name]||[];currentList=names;var groups=['İMPARATOR','ALTIN','GÜMÜŞ','BRONZ'];document.getElementById('commanderList').innerHTML=groups.map(function(tier,i){var these=(name==='Medeniyetsiz'&&tier==='BRONZ')?names:[];if(!these.length)return '';return '<section class="tier"><h3>'+tier+'</h3><div class="cards">'+these.map(function(n,j){return '<button class="comm panel '+(j%3?'dim':'')+'" data-cmd="'+j+'"><span class="slot portrait">Görsel gerekli<br>kart portresi</span><span class="role">Piyade</span><strong>'+esc(n)+'</strong></button>'}).join('')+'</div></section>'}).join('')||'<div class="slot" style="height:110px">Görsel gerekli<br>komutan kartları</div>';document.querySelectorAll('[data-cmd]').forEach(function(b){b.addEventListener('pointerup',function(){showProfile(Number(b.dataset.cmd))})})}
function showProfile(index){selected=index;var list=currentList.length?currentList:['Komutan'];document.getElementById('profileName').textContent=list[index];nation.classList.add('hidden');profile.classList.remove('hidden');document.getElementById('crumb').textContent=currentCiv+' · '+list[index]}
function showModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;modal.classList.remove('hidden')}
renderCivs();document.getElementById('filterOpen').addEventListener('pointerup',function(){showModal('KOMUTAN FİLTRESİ','<label>Komutan adı<input id="search" placeholder="Ad ara"></label><div class="fields"><label>Sınıf<select><option>Tümü</option><option>Piyade</option><option>Okçu</option><option>Süvari</option></select></label><label>Tier<select><option>Tümü</option><option>İmparator</option><option>Altın</option><option>Gümüş</option><option>Bronz</option></select></label><label>Medeniyet<select id="civSelect"><option>Tümü</option>'+civNames.map(function(n){return '<option>'+esc(n)+'</option>'}).join('')+'</select></label></div><div class="dialog-foot"><button class="pill" id="reset">Filtreleri sıfırla</button><button class="pill active" id="apply">Gizle</button></div>');document.getElementById('apply').addEventListener('pointerup',function(){var q=document.getElementById('search').value;renderCivs(q);modal.classList.add('hidden')});document.getElementById('reset').addEventListener('pointerup',function(){renderCivs();modal.classList.add('hidden')})});
document.getElementById('backNation').addEventListener('pointerup',function(){nation.classList.add('hidden');home.classList.remove('hidden');document.getElementById('crumb').textContent='Medeniyetler'});document.getElementById('close').addEventListener('pointerup',function(){if(!profile.classList.contains('hidden')){profile.classList.add('hidden');openNation(currentCiv)}else if(!nation.classList.contains('hidden')){document.getElementById('backNation').dispatchEvent(new PointerEvent('pointerup'))}else location.href='../'});document.getElementById('modalX').addEventListener('pointerup',function(){modal.classList.add('hidden')});modal.addEventListener('pointerup',function(e){if(e.target===modal)modal.classList.add('hidden')});document.getElementById('info').addEventListener('pointerup',function(){showModal('MEDENİYET BİLGİSİ','<div class="slot" style="height:90px">Görsel gerekli · medeniyet sancağı</div>')});document.getElementById('commInfo').addEventListener('pointerup',function(){showModal('KOMUTAN BİLGİSİ','<p>Çağrı Otağı paketleri · Pazar · Meydan Okuma · Fetih Yarışı</p><button class="pill active">Git</button>')});document.getElementById('history').addEventListener('pointerup',function(){showModal('TARİHÇE','<div class="slot" style="height:100px">Görsel gerekli · tarihçe görseli</div>')});['prev','next'].forEach(function(id){document.getElementById(id).addEventListener('pointerup',function(){var n=currentList.length||1;showProfile((selected+(id==='next'?1:n-1))%n)})});document.querySelectorAll('[data-tab]').forEach(function(b){b.addEventListener('pointerup',function(){document.querySelectorAll('[data-tab]').forEach(function(x){x.classList.toggle('active',x===b)});document.getElementById('ability').classList.toggle('hidden',b.dataset.tab!=='ability');document.getElementById('costume').classList.toggle('hidden',b.dataset.tab!=='costume')})});
})();
</script></body></html>
