<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<title>Warsigil · Sınırlı Teklif</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
#liste{min-height:44px;display:flex;align-items:center;padding:0 8px}
</style></head>
<body><div id="area"><div id="scene"><a id="liste" href="../">← Liste</a><main aria-label="Sınırlı teklif penceresi"><div class="head">SINIRLI TEKLİF</div><div class="counter" id="count">1 / 3</div><button class="x" id="close" aria-label="Kapat">×</button><div class="content"><section class="offer"><h1 id="title">KULE KAT 50 PAKETİ</h1><div class="subtitle">İlerleme teklif paketi</div><div class="timer">Kalan süre: 23:41:00</div><div class="layout"><div class="art"><div class="slot"><strong>Görsel gerekli</strong><span>Teklif paketi · 205 × 139 px</span></div></div><div class="items"><div class="item">Zümrüt <b>1.000</b></div><div class="item">Altın Komutan Paketi <b>1</b></div><div class="item">Büyük Tecrübe Kitabı <b>2</b></div><div class="item">Altın <b>150.000</b></div></div></div><div class="foot"><span class="limit">Hesap başına bir kez</span><div class="actions"><button class="round" id="prev" aria-label="Önceki teklif">‹</button><button class="buy" id="buy">$4.99 · Satın Al</button><button class="round" id="next" aria-label="Sonraki teklif">›</button></div></div><div class="page" id="dots">● ○ ○</div></section></div><div class="modal" id="modal"><div class="dialog"><h2 id="dialogTitle">Satın alma</h2><p id="dialogText">Teklif satın alma onayı</p><button id="ok">Devam</button></div></div></main></div></div>
<script>
(()=>{const area=document.getElementById('area'),scene=document.getElementById('scene');function fit(){const s=Math.min(area.clientWidth/844,area.clientHeight/390);scene.style.transform=`translate(${(area.clientWidth-844*s)/2}px,${(area.clientHeight-390*s)/2}px) scale(${s})`}fit();addEventListener('resize',fit);let n=0;const titles=['KULE KAT 50 PAKETİ','KULE KAT 100 PAKETİ','İMPARATOR KOMUTAN PAKETİ'];function show(){document.getElementById('title').textContent=titles[n];document.getElementById('count').textContent=`${n+1} / 3`;document.getElementById('dots').textContent=['○','○','○'].map((x,i)=>i===n?'●':x).join(' ')}function move(d){n=(n+d+titles.length)%titles.length;show()}document.getElementById('prev').addEventListener('pointerup',()=>move(-1));document.getElementById('next').addEventListener('pointerup',()=>move(1));const modal=document.getElementById('modal');document.getElementById('buy').addEventListener('pointerup',()=>{document.getElementById('dialogTitle').textContent='Satın alma';document.getElementById('dialogText').textContent='Teklif satın alma onayı';document.getElementById('ok').textContent='Onayla';modal.style.display='flex'});document.getElementById('ok').addEventListener('pointerup',()=>{document.getElementById('dialogTitle').textContent='Teklif alındı';document.getElementById('dialogText').textContent='Bu teklif kullanıldı';document.getElementById('ok').textContent='Kapat';document.getElementById('ok').onclick=()=>modal.style.display='none'});document.getElementById('close').addEventListener('pointerup',()=>{location.href='../ana-ekran/'});modal.addEventListener('pointerup',e=>{if(e.target===modal)modal.style.display='none'})})();
</script></body></html>
