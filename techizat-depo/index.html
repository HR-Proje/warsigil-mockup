<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060A16">
<link rel="icon" href="data:,">
<title>Warsigil · Teçhizat ve Depo</title>
<style>
  html, body { margin: 0; height: 100%; background: #060A16; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; -webkit-text-size-adjust: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
  #alan { position: absolute; top: env(safe-area-inset-top); right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); overflow: hidden; }
  #sahne { position: absolute; left: 0; top: 0; width: 844px; height: 390px; transform-origin: 0 0; overflow: hidden; }
  #oyun { position: absolute; left: 0; top: 0; width: 844px; height: 390px; }
  #liste { position: absolute; z-index: 5; left: 222px; top: 2px; padding: 3px 8px; border-radius: 999px; background: rgba(6, 10, 22, .55); border: 1px solid rgba(201, 160, 78, .45); color: #F4ECD8; opacity: .5; font: 600 11px/14px "Barlow Semi Condensed", system-ui, sans-serif; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  #liste:active { opacity: .9; }
  #dondur { display: none; position: absolute; inset: 0; z-index: 6; align-items: center; justify-content: center; text-align: center; padding: 24px; color: #F6D88E; font: 800 18px/1.3 "Cinzel", Georgia, serif; letter-spacing: .08em; text-transform: uppercase; background: #060A16; }
  @media (orientation: portrait) { #sahne { visibility: hidden; } #dondur { display: flex; } }
</style>
</head>
<body>
<div id="alan">
  <div id="sahne">
    <div id="oyun"></div>
    <a id="liste" href="../">← Liste</a>
  </div>
  <div id="dondur">Telefonu yatay çevir</div>
</div>
<script>
  window.WS_BASLANGIC = 'techizat-depo';
  (function () {
    var alan = document.getElementById('alan'), sahne = document.getElementById('sahne');
    function sigdir() {
      var w = alan.clientWidth, h = alan.clientHeight, s = Math.min(w / 844, h / 390);
      sahne.style.transform = 'translate(' + ((w - 844 * s) / 2) + 'px,' + ((h - 390 * s) / 2) + 'px) scale(' + s + ')';
    }
    sigdir();
    window.addEventListener('resize', sigdir);
    window.addEventListener('orientationchange', sigdir);
  })();
</script>
<script src="../assets/vendor/preact.min.js"></script>
<script src="../assets/tuval/dc-mini.js"></script>
</body>
</html>
