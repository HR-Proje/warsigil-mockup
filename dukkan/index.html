<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="robots" content="noindex"><title>Warsigil · Dükkân</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060A16;color:#F4ECD8;font-family:"Barlow Semi Condensed",system-ui,sans-serif}button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}#area{position:absolute;inset:0;overflow:hidden}#scene{position:absolute;left:0;top:0;width:844px;height:390px;transform-origin:0 0;overflow:hidden;background:radial-gradient(ellipse at 65% 0%,#1A2647,#0B1224 68%)}#liste{position:absolute;z-index:10;left:6px;top:5px;color:#F4ECD8;text-decoration:none;font-size:12px;background:#0B1224;border:1px solid #C9A04E;border-radius:999px;padding:4px 9px}.top{height:49px;position:absolute;left:0;right:0;top:0;border-bottom:1px solid #C9A04E;background:#10192e;display:flex;align-items:center;padding:0 54px 0 104px;gap:18px}.title{font:900 20px Cinzel,serif;color:#F6D88E;letter-spacing:.08em;margin-right:auto}.balance{font-weight:700;color:#F6D88E;font-size:14px}.close{position:absolute;right:2px;top:2px;width:44px;height:44px;border:0;background:none;color:#F4ECD8;font-size:26px}.rail{position:absolute;left:8px;top:55px;bottom:9px;width:158px;display:flex;flex-direction:column;gap:7px}.section{width:100%;min-height:48px;border:1px solid #C9A04E;border-radius:7px;background:#121B33;text-align:left;padding:7px 10px;font-weight:800;font-size:15px;color:#A9B4D0}.section.active{background:#26355F;color:#F6D88E;box-shadow:inset 3px 0 #C9A04E}.section .mark{float:right;color:#F6D88E}.content{position:absolute;left:174px;right:12px;top:55px;bottom:10px;border:1px solid #C9A04E;border-radius:7px;background:rgba(18,27,51,.82);overflow:hidden}.tabs{height:43px;display:flex;gap:5px;padding:5px 7px;border-bottom:1px solid #6B4E1C}.tab{flex:1;min-width:0;border:1px solid #6B4E1C;border-radius:999px;background:#0B1224;color:#A9B4D0;font-weight:700;font-size:13px;white-space:nowrap}.tab.active{background:#26355F;color:#F6D88E;border-color:#C9A04E}.view{display:none;height:calc(100% - 43px);padding:8px;overflow:auto;touch-action:pan-y}.view.active{display:block}.cards{height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:7px}.card{min-width:0;border:1px solid #C9A04E;border-radius:7px;background:linear-gradient(145deg,#182847,#0B1224);display:flex;flex-direction:column;overflow:hidden}.cardhead{height:29px;display:flex;align-items:center;justify-content:center;text-align:center;background:#17233d;color:#F6D88E;font-weight:800;font-size:14px;border-bottom:1px solid #6B4E1C}.cardbody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:5px}.slot{width:100%;height:100%;min-height:0;border:1px dashed #A9B4D0;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#A9B4D0;font-size:12px;line-height:1.1}.slot b{color:#F6D88E;font-size:13px}.slot small{font-size:12px;margin-top:4px}.foot{height:39px;border-top:1px solid #6B4E1C;display:flex;align-items:center;justify-content:space-between;padding:0 7px;font-weight:700;font-size:13px;color:#F6D88E}.pill{min-height:32px;padding:0 14px;border:1px solid #C9A04E;border-radius:999px;background:#1DB377;color:#081b17;font-weight:800;font-size:13px}.mini{min-height:44px;padding:0 12px;border-radius:999px;background:#121B33;color:#F4ECD8;border:1px solid #C9A04E;font-size:13px}.wide{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:7px;height:100%}.growth-grid{grid-template-columns:repeat(5,150px);grid-template-rows:repeat(2,minmax(0,1fr));width:max-content;min-width:100%;overflow:auto}.growth .cardbody{flex-direction:column;gap:3px}.growth-grid{grid-template-columns:repeat(5,150px);grid-template-rows:repeat(2,minmax(0,1fr));width:max-content;min-width:100%;overflow:auto}.growth .cardbody{flex-direction:column;gap:3px}.growth-grid{grid-template-columns:repeat(5,150px);grid-template-rows:repeat(2,minmax(0,1fr));width:max-content;min-width:100%;overflow:auto}.growth .cardbody{flex-direction:column;gap:3px}.growth .slot{height:55px;flex:1}.range{font-size:14px;color:#F6D88E;font-weight:800}.growth .foot{height:40px}.free-layout{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:9px}.free-panel{border:1px solid #C9A04E;border-radius:7px;background:#0B1224;padding:7px;display:flex;flex-direction:column;gap:6px;min-height:0}.free-layout:has(.free-panel[style*="display:none"]){grid-template-columns:1fr}.free-panel .wide{grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:68px;overflow:auto}.free-panel .wide .card{min-height:68px;display:grid;grid-template-columns:88px 1fr 114px;grid-template-rows:1fr}.free-panel .wide .cardhead{height:auto;border:0;background:transparent;font-size:12px}.free-panel .wide .cardbody{padding:3px}.free-panel .wide .slot small{display:none}.free-panel .wide .foot{height:auto;border:0;display:flex;justify-content:center;padding:2px;font-size:12px}.free-panel h2{margin:0;text-align:center;font:800 14px Cinzel,serif;color:#F6D88E}.free-row{min-height:0;flex:1;display:grid;grid-template-columns:1fr 95px;gap:6px;border-top:1px solid #26355F;padding-top:5px}.detail{position:absolute;z-index:8;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,5,12,.76)}.detail.open{display:flex}.dialog{width:540px;height:300px;border:1px solid #C9A04E;border-radius:8px;background:#121B33;position:relative;padding:12px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:34px 1fr 44px;gap:8px}.dialog h2{grid-column:1/3;margin:0;text-align:center;font:900 17px Cinzel,serif;color:#F6D88E}.dialog .slot{grid-row:2}.items{grid-row:2;border:1px solid #6B4E1C;border-radius:6px;padding:7px;display:grid;grid-template-columns:1fr 1fr;gap:6px}.items .slot{font-size:12px}.dialog .actions{grid-column:1/3;display:flex;justify-content:flex-end;align-items:center;gap:8px}.dialog .close{right:2px;top:1px}.toast{position:absolute;z-index:12;left:50%;bottom:12px;transform:translateX(-50%);display:none;border:1px solid #C9A04E;border-radius:7px;background:#121B33;color:#F6D88E;padding:8px 14px;font-size:14px}.toast.show{display:block}@media(orientation:portrait){#scene{visibility:hidden}}
</style></head><body><div id="area"><main id="scene" aria-label="Dükkân"><a id="liste" href="../">← Liste</a>
<header class="top"><div class="title">DÜKKÂN</div><span class="balance">Zümrüt · —</span><span class="balance">Altın · —</span><button class="close" aria-label="Kapat" data-action="home">×</button></header>
<nav class="rail" aria-label="Dükkân bölümleri"><button class="section active" data-section="general">Genel <span class="mark">›</span></button><button class="section" data-section="growth">Gelişim Paketleri</button><button class="section" data-section="free">Ücretsiz Ödüller <span class="mark">●</span></button></nav>
<section class="content"><div class="tabs" id="tabs"></div><div class="view active" id="view"></div></section>
<div class="detail" id="detail"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><button class="close" data-action="close-detail" aria-label="Kapat">×</button><h2 id="detailTitle">Paket</h2><div class="slot" id="heroSlot"></div><div class="items" id="itemSlots"></div><div class="actions"><button class="mini" data-action="close-detail">Geri</button><button class="pill" id="buyButton">Satın Al</button></div></section></div><div class="toast" id="toast" role="status"></div></main></div>
<script>
(function(){'use strict';var area=document.getElementById('area'),scene=document.getElementById('scene'),tabs=document.getElementById('tabs'),view=document.getElementById('view'),detail=document.getElementById('detail'),toast=document.getElementById('toast'),section='general',tab='Önerilen';var general=['Önerilen','Özel Teklifler','Kart Paketleri','Para Birimleri','Günlük'],growth=['Zümrüt Paketleri','Sezon Jetonu Paketleri'];
function fit(){var s=Math.min(area.clientWidth/844,area.clientHeight/390);scene.style.transform='translate('+((area.clientWidth-844*s)/2)+'px,'+((area.clientHeight-390*s)/2)+'px) scale('+s+')'}function slot(n,z){return '<div class="slot"><b>Görsel gerekli</b><span>'+n+'</span><small>'+z+'</small></div>'}function card(n,m,p){return '<article class="card"><div class="cardhead">'+n+'</div><div class="cardbody">'+slot(n.toLocaleLowerCase("tr")+'-gorseli.png','160 × 92 px')+'</div><div class="foot"><span>'+m+'</span><button class="mini" data-open="'+n+'">'+p+'</button></div></article>'}
function setSection(s){section=s;document.querySelectorAll('.section').forEach(function(b){b.classList.toggle('active',b.dataset.section===s)});tab=s==='general'?general[0]:s==='growth'?growth[0]:'Ücretsiz Paketler';render()}function render(){var ts=section==='general'?general:section==='growth'?growth:['Ücretsiz Paketler','Reklam İzle'];tabs.innerHTML=ts.map(function(t){return '<button class="tab '+(tab===t?'active':'')+'" data-tab="'+t+'">'+t+'</button>'}).join('');if(section==='general'){var ns,ms,ps;if(tab==='Günlük'){ns=['Günlük Hediye','Altın Kesesi','Dönen Teklif','Günlük Hediye','Altın Kesesi','Dönen Teklif'];ms=['Günlük','50 Zümrüt','Günlük','Günlük','50 Zümrüt','Günlük'];ps=['Ücretsiz','50 Zümrüt','Aç','Ücretsiz','50 Zümrüt','Aç']}else if(tab==='Kart Paketleri'){ns=['Normal Paket','Altın Komutan Paketi','Elite İmparator Paketi','Başlangıç Paketi','Normal Paket','Altın Komutan Paketi'];ms=['Komutan','Komutan','Komutan','Tek seferlik','Komutan','Komutan'];ps=['100 Zümrüt','Aç','Aç','$2.99','100 Zümrüt','Aç']}else if(tab==='Para Birimleri'){ns=['Zümrüt','Zümrüt','Sezon Jetonu','Altın Kesesi','Altın Sandığı','Hazine Sandığı'];ms=['Paket','Paket','Paket','30.000 Altın','160.000 Altın','1.100.000 Altın'];ps=['Satın Al','Satın Al','Satın Al','60 Zümrüt','300 Zümrüt','2.000 Zümrüt']}else{ns=['Gelişim Paketi','Aylık Kart','Başlangıç Paketi','Normal Paket','Günlük Teklif','Özel Teklif'];ms=['Tek seferlik','30 gün','Tek seferlik','Komutan','Günlük','Özel'];ps=['Aç','Satın Al','$2.99','100 Zümrüt','Aç','Aç']}view.innerHTML='<div class="cards">'+ns.map(function(n,i){return card(n,ms[i],ps[i])}).join('')+'</div>'}else if(section==='growth'){var emerald=tab===growth[0],ranges=['1–10','11–20','21–30','31–35','36–40','41–45','46–50','51–55','56–60'],prices=emerald?['$1.99','$3.99','$5.99','$5.99','$5.99','$5.99','$5.99','$5.99','$5.99']:['$4.99','$9.99','$14.99','$14.99','$14.99','$14.99','$14.99','$14.99','$14.99'];view.innerHTML='<div class="wide growth-grid">'+ranges.map(function(r,i){return '<article class="card growth"><div class="cardhead">Paket '+(i+1)+'</div><div class="cardbody"><div class="range">Seviye '+r+'</div>'+slot((emerald?'zumrut':'sezon-jetonu')+'-gelisim-'+(i+1)+'.png','112 × 55 px')+'</div><div class="foot"><span>'+prices[i]+'</span><button class="mini" data-open="Gelişim Paketi '+(i+1)+'">Aç</button></div></article>'}).join('')+'</div>'}else{view.innerHTML='<div class="free-layout"><section class="free-panel" style="'+(tab==='Ücretsiz Paketler'?'':'display:none')+'"><h2>ÜCRETSİZ PAKETLER</h2>'+[['Günlük Komutan Hediyesi','gunluk-komutan-hediyesi.png'],['Haftalık Ücretsiz Paket','haftalik-ucretsiz-paket.png']].map(function(x){return '<div class="free-row"><div>'+slot(x[1],'210 × 76 px')+'</div><button class="mini" data-open="'+x[0]+'">Detay</button></div>'}).join('')+'</section><section class="free-panel" style="'+(tab==='Reklam İzle'?'':'display:none')+'"><h2>REKLAM İZLE</h2><div class="wide">'+Array.from({length:10},function(_,i){return '<article class="card"><div class="cardhead">'+(i+1)+'. Basamak</div><div class="cardbody">'+slot(i===9?'gizemli-paket.png':'zumrut-odulu.png','78 × 48 px')+'</div><div class="foot"><span>'+(i===9?'Gizemli Paket':'Zümrüt')+'</span><button class="mini" data-claim="Adım '+(i+1)+'">Al</button></div></article>'}).join('')+'</div></section></div>'}}
function openDetail(n){document.getElementById('detailTitle').textContent=n;document.getElementById('heroSlot').innerHTML=slot(n.toLocaleLowerCase('tr').replaceAll(' ','-')+'-gorseli.png','220 × 112 px');document.getElementById('itemSlots').innerHTML=[1,2,3,4].map(function(i){return slot('paket-icerigi-'+i+'.png','92 × 64 px')}).join('');document.getElementById('buyButton').textContent=n.indexOf('Ücretsiz')>=0||n.indexOf('Hediyesi')>=0?'Ücretsiz Aç':'Satın Al';detail.classList.add('open')}function msg(s){toast.textContent=s;toast.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(function(){toast.classList.remove('show')},1800)}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.section){setSection(b.dataset.section);return}if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.open){openDetail(b.dataset.open);return}if(b.dataset.claim){b.textContent='Alındı';b.disabled=true;b.classList.add('claim');msg('Örnek ödül alındı.');return}if(b.dataset.action==='close-detail'){detail.classList.remove('open');return}if(b.dataset.action==='home'){location.href='../ana-ekran/';return}if(b.id==='buyButton')msg('Satın alma örnek akışıdır.')});detail.addEventListener('pointerdown',function(e){if(e.target===detail)detail.classList.remove('open')});window.addEventListener('resize',fit);window.addEventListener('orientationchange',fit);fit();render()})();
</script></body></html>
