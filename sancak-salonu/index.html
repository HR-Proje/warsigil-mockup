<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<title>Warsigil · Sancak Salonu</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0B1224;color:#F4ECD8;font-family:"Barlow Semi Condensed",Arial,sans-serif}#stage{position:absolute;width:844px;height:390px;left:50%;top:50%;transform-origin:center center;background:radial-gradient(ellipse at 42% 35%,#172441,#0B1224 74%);overflow:hidden}.top{position:absolute;inset:0 0 auto;height:43px;background:#10192e;border-bottom:1px solid #C9A04E;display:flex;align-items:center;padding:0 18px;gap:14px}.title{margin-left:62px;font:900 18px Cinzel,Georgia,serif;letter-spacing:.08em;color:#F6D88E}.resources{margin-left:auto;display:flex;gap:8px}.pill{height:28px;min-width:84px;padding:0 12px;border:1px solid #C9A04E;border-radius:999px;background:#121B33;display:grid;place-items:center;font-size:13px;font-weight:700;text-shadow:1px 1px #000}.pill b{color:#F6D88E}.close{width:44px;height:44px;border:0;background:none;color:#F4ECD8;font-size:25px;cursor:pointer}.close:active{color:#F6D88E}.layout{position:absolute;left:16px;right:16px;top:54px;bottom:14px;display:grid;grid-template-columns:1fr 222px;gap:13px}.main{min-width:0;display:flex;flex-direction:column}.sectionhead{height:30px;display:flex;align-items:center;border-bottom:1px solid #C9A04E;color:#F6D88E;font:800 13px Cinzel,Georgia,serif;letter-spacing:.06em}.sectionhead small{margin-left:auto;color:#A9B4D0;font:600 12px Arial,sans-serif}.grid{padding-top:9px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(2,132px);gap:8px}.card{position:relative;border:1px solid #C9A04E;border-radius:7px;background:linear-gradient(145deg,#182543,#111a30);color:#F4ECD8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px 5px;cursor:pointer;touch-action:manipulation}.card[aria-pressed="true"]{border:2px solid #F6D88E;box-shadow:0 0 12px #C9A04E88;background:#202d49}.rank{position:absolute;top:7px;font-size:12px;font-weight:800;color:#F6D88E;text-shadow:1px 1px #000}.flag{width:58px;height:58px;border:1px dashed #A9B4D0;border-radius:7px;display:flex;align-items:center;justify-content:center;text-align:center;color:#A9B4D0;font-size:12px;line-height:1.2}.name{font-size:13px;font-weight:700}.dot{position:absolute;right:7px;top:7px;width:9px;height:9px;border-radius:50%;background:#C84A4A}.side{position:relative;border:1px solid #C9A04E;border-radius:7px;background:#121B33;padding:11px;overflow:hidden}.side h2{margin:0 0 8px;color:#F6D88E;font:900 14px Cinzel,Georgia,serif;letter-spacing:.06em}.selected{display:flex;align-items:center;gap:9px;border-bottom:1px solid #6f5b37;padding-bottom:8px}.selected .flag{width:42px;height:42px;flex:none}.selected strong{font-size:14px}.sub{font-size:12px;color:#A9B4D0}.bonus{padding:8px 0 5px;border-bottom:1px solid #34405a;font-size:12px}.bonus span{display:block;color:#A9B4D0;margin-bottom:3px}.bonus b{font-size:13px;color:#F4ECD8}.table{margin-top:6px;display:grid;grid-template-columns:34px 1fr 48px;gap:2px 5px;font-size:11.5px;max-height:108px;overflow:auto;touch-action:pan-y}.table div{padding:2px 3px;color:#65718e}.table .done{color:#F4ECD8}.table .next{color:#F6D88E;background:#35405a;border-radius:3px}.table .head{color:#A9B4D0;font-weight:700;border-bottom:1px solid #47536d}.upgrade{position:absolute;bottom:9px;left:10px;right:10px;height:38px;border:1px solid #C9A04E;border-radius:999px;background:#C9A04E;color:#21190b;font-weight:900;font-size:14px;cursor:pointer}.upgrade:disabled{background:#30384a;color:#A9B4D0;border-color:#58627a}.toast{position:absolute;bottom:52px;left:0;right:0;text-align:center;color:#FFB547;font-size:12px;min-height:16px}#liste{position:absolute;z-index:3;left:8px;top:5px;color:#F4ECD8;font-size:12px;text-decoration:none;padding:4px 7px;border-radius:999px;min-height:30px}#liste:active{background:#24314d}
</style>
</head>
<body>
<div id="stage">
<a id="liste" href="../">← Liste</a>
<header class="top"><div class="title">SANCAK SALONU</div><div class="resources"><div class="pill">Altın <b>—</b></div><div class="pill">Zümrüt <b>—</b></div><div class="pill">Haklar <b>—</b></div></div><button class="close" id="close" aria-label="Kapat">×</button></header>
<div class="layout"><main class="main"><div class="sectionhead">MEDENİYET KARTLARI <small>12 MEDENİYET · F0–F10</small></div><div class="grid" id="grid"></div></main>
<aside class="side"><h2 id="panelTitle">KART DETAYI</h2><div class="selected"><div class="flag" id="flag">Görsel gerekli<br>Medeniyet_Sancagi_U23.png · 58×58</div><div><strong id="civName">Türk</strong><div class="sub" id="level">F0 · ×1,00</div></div></div><div class="bonus"><span>Başkomutan bonusu</span><b>Atlı Sızma Hasarı +%10</b></div><div class="bonus"><span>Başkomutan bonusu</span><b>Rage Birikimi +%10</b></div><div class="table" id="table"></div><div class="toast" id="toast"></div><button class="upgrade" id="upgrade">Yükselt · 20.000 Altın</button></aside></div>
</div>
<script>
const civs=['Türk','Roma','Yunan','Pers','Çin','Moğol','Arap','Alman','Viking','Fransız','İngiliz','Japon'];
const costs=[20000,40000,60000,100000,140000,180000,240000,300000,400000,520000];
const multipliers=['×1,00','×1,05','×1,10','×1,15','×1,20','×1,25','×1,30','×1,35','×1,40','×1,45','×1,50'];
let selected=0, level=0;
const grid=document.getElementById('grid'),table=document.getElementById('table'),upgrade=document.getElementById('upgrade');
function draw(){grid.innerHTML='';civs.forEach((name,i)=>{const b=document.createElement('button');b.className='card';b.type='button';b.setAttribute('aria-pressed',String(i===selected));b.innerHTML='<span class="rank">F 0/10</span><span class="flag">Görsel gerekli<br>Medeniyet_Sancagi_U23.png · 58×58</span><span class="name"></span>';b.querySelector('.name').textContent=name;b.addEventListener('pointerup',()=>{selected=i;level=0;document.getElementById('civName').textContent=name;document.getElementById('level').textContent='F0 · ×1,00';draw();});grid.appendChild(b)});table.innerHTML='<div class="head">Sv.</div><div class="head">Bedel · Altın</div><div class="head">Çarpan</div>';for(let i=1;i<=10;i++){const cl=i<=(level)?'done':i===level+1?'next':'';[String(i),costs[i-1].toLocaleString('tr-TR'),multipliers[i]].forEach(v=>{const d=document.createElement('div');d.className=cl;d.textContent=v;table.appendChild(d)})}upgrade.disabled=level>=10;upgrade.textContent=level>=10?'Maksimum seviye':`Yükselt · ${costs[level].toLocaleString('tr-TR')} Altın`}
upgrade.addEventListener('pointerup',()=>{if(level<10){document.getElementById('toast').textContent='Altın bakiyesi örnek veride belirtilmedi';}});
document.getElementById('close').addEventListener('pointerup',()=>{window.location.href='../ana-ekran/';});
draw();
function fit(){const s=Math.min(innerWidth/844,innerHeight/390);const el=document.getElementById("stage");el.style.left="50%";el.style.top="50%";el.style.transform=`translate(-50%,-50%) scale(${s})`;}addEventListener("resize",fit);fit();
</script>
</body>
</html>
