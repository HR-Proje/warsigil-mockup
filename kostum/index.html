<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kostüm · Warsigil</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070d1b;color:#F4ECD8;font-family:'Barlow Semi Condensed','Arial Narrow',sans-serif}#fit{position:absolute;width:844px;height:390px;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center}main{position:absolute;inset:0;background:radial-gradient(ellipse at 43% 48%,#1b2949,#0B1224 70%);overflow:hidden}.top{position:absolute;inset:0 0 auto;height:48px;background:#101a30;border-bottom:1px solid #C9A04E;display:flex;align-items:center;justify-content:center}.title{font:900 20px Cinzel,Georgia,serif;letter-spacing:.06em;color:#F6D88E}.list{position:absolute;left:12px;top:9px;color:#F4ECD8;font-size:14px;text-decoration:none;min-height:30px;display:flex;align-items:center}.x{position:absolute;right:4px;top:2px;width:44px;height:44px;border:0;background:none;color:#F4ECD8;font-size:27px;line-height:1;touch-action:manipulation}.hero{position:absolute;left:28px;top:60px;width:526px;height:306px;display:grid;place-items:center}.figure{position:absolute;left:122px;top:12px;width:250px;height:262px;border:1px dashed #8f7847;border-radius:7px;background:linear-gradient(145deg,#172440,#101a30);display:flex;align-items:center;justify-content:center;text-align:center;color:#A9B4D0;font-size:15px;line-height:1.6}.figure::before{content:"";position:absolute;inset:20px;border:1px solid rgba(201,160,78,.22);border-radius:5px}.arrow{position:absolute;top:122px;width:46px;height:46px;border-radius:50%;border:1px solid #C9A04E;background:#121B33;color:#F6D88E;font-size:25px;touch-action:manipulation}.prev{left:12px}.next{right:12px}.footnote{position:absolute;bottom:5px;left:65px;width:360px;text-align:center;color:#A9B4D0;font-size:12px}.side{position:absolute;right:18px;top:58px;width:250px;height:308px;padding:12px;border:1px solid #C9A04E;border-radius:7px;background:rgba(18,27,51,.94)}.side h2{margin:0 0 10px;color:#F6D88E;font:900 15px Cinzel,Georgia,serif}.cards{display:flex;flex-direction:column;gap:8px;max-height:196px;overflow:auto;touch-action:pan-y}.card{position:relative;width:100%;height:75px;min-height:75px;border:1px solid #56627b;border-radius:6px;background:#172441;color:#F4ECD8;text-align:left;padding:5px 8px 5px 83px;font-size:15px;touch-action:manipulation}.card.selected{border:2px solid #54cc78}.thumb{position:absolute;left:7px;top:6px;width:67px;height:59px;border:1px dashed #A9B4D0;border-radius:5px;display:grid;place-items:center;text-align:center;color:#A9B4D0;font-size:12px;line-height:1.1}.ribbon{display:block;color:#72b5ef;font-size:12px;margin-top:6px}.card.special .ribbon{color:#FFB547}.actions{position:absolute;bottom:11px;left:12px;right:12px;display:flex;gap:9px}.pill{height:44px;border:1px solid #C9A04E;border-radius:999px;background:#202d48;color:#F4ECD8;font-size:15px;font-weight:700;padding:0 20px;touch-action:manipulation}.pill.buy{flex:1;background:#14583e;border-color:#45bd85;color:#e3ffef}.overlay{position:absolute;inset:0;background:rgba(3,7,16,.76);display:grid;place-items:center}.dialog{position:relative;width:500px;height:374px;padding:19px 24px 18px;border:1px solid #C9A04E;border-radius:7px;background:#121B33;box-shadow:0 12px 40px #0009}.dialog h2{text-align:center;color:#F6D88E;font:900 18px Cinzel,Georgia,serif;margin:2px 40px 14px}.intro{display:flex;align-items:center;gap:13px;margin-bottom:12px}.avatar{width:54px;height:60px;border:1px dashed #A9B4D0;border-radius:5px;display:grid;place-items:center;color:#A9B4D0;font-size:12px;text-align:center}.costname{font-weight:700;font-size:16px}.muted{color:#A9B4D0;font-size:13px;margin-top:4px}.sources{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:350px;margin:0 auto 8px}.sources button{height:38px;padding:0 8px;font-size:13px}.sources{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:350px;margin:0 auto 8px}.sources button{height:38px;padding:0 8px;font-size:13px}.sourcebox{width:190px;margin:0 auto;border:1px solid #C9A04E;border-radius:6px;overflow:hidden;text-align:center}.sourcebox strong{display:block;padding:8px;color:#F6D88E;border-bottom:1px solid #C9A04E}.sourcevisual{height:54px;display:grid;place-items:center;color:#A9B4D0;font-size:13px;border-bottom:1px dashed #74809a}.sourcebuttons{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:7px}.sourcebuttons button{height:38px}.hidden{display:none!important}
</style></head>
<body><div id="fit"><main><header class="top"><a id="liste" class="list" href="../">← Liste</a><div class="title">KOSTÜM</div><button class="x" id="close" aria-label="Kapat">×</button></header><section class="hero"><button class="arrow prev" id="prev" aria-label="Önceki kostüm">‹</button><div class="figure" id="preview">Görsel gerekli<br>Komutan önizleme<br>250 × 262 px</div><button class="arrow next" id="next" aria-label="Sonraki kostüm">›</button><div class="footnote">Kostüm yalnızca görünüşü değiştirir.</div></section><aside class="side"><h2>KOSTÜMLER</h2><div class="cards" id="cards"></div><div class="actions"><button class="pill" id="wear">Giy</button><button class="pill buy" id="buy">Satın Al</button></div></aside><div class="overlay hidden" id="modal"><section class="dialog" role="dialog" aria-modal="true"><button class="x" id="modalX" aria-label="Kapat">×</button><h2>KOSTÜM KAYNAĞI</h2><div class="intro"><div class="avatar">Görsel gerekli<br>54 × 60 px</div><div><div class="costname" id="modalName"></div><div class="muted">Bu kostüm aşağıdaki kaynaklardan elde edilebilir.</div></div></div><div class="sources" id="sources"><button class="pill" data-source="Dükkân · Zü mrüt">Dükkân · Zümrüt</button><button class="pill" data-source="Fetih Yarışı">Fetih Yarışı</button><button class="pill" data-source="Sezon Bileti">Sezon Bileti</button><button class="pill" data-source="Paket">Paket</button></div><div class="sourcebox"><strong id="sourceTitle">Kostüm kaynağı</strong><div class="sourcevisual">Görsel gerekli<br>176 × 92 px</div><div class="sourcebuttons"><button class="pill buy" id="purchase">Satın Al</button><button class="pill" id="go">Git</button></div></div></section></div></main></div>
<script>
const costumes=[{name:'Varsayılan Kostüm',kind:'Varsayılan',owned:true,equipped:true},{name:'Sezon Kostümü',kind:'Özel kostüm',owned:false,equipped:false}];
let selected=0;
const cards=document.getElementById('cards'),wear=document.getElementById('wear'),buy=document.getElementById('buy'),modal=document.getElementById('modal');
function render(){cards.replaceChildren();costumes.forEach((item,index)=>{const button=document.createElement('button');button.className='card'+(index===selected?' selected':'')+(!item.owned?' special':'');button.innerHTML='<span class="thumb">Görsel gerekli<br>67 × 59 px</span>'+item.name+'<span class="ribbon">'+item.kind+'</span>';button.addEventListener('pointerup',()=>{selected=index;render()});cards.append(button)});const item=costumes[selected];wear.textContent=item.equipped?'Giyildi':'Giy';wear.disabled=item.equipped||!item.owned;buy.textContent=item.owned?'Kostüm Seçildi':'Kostümü Al';buy.disabled=item.owned}
function fit(){const scale=Math.min(innerWidth/844,innerHeight/390);document.getElementById('fit').style.setProperty('--scale',scale)}
document.getElementById('prev').addEventListener('pointerup',()=>{selected=(selected+costumes.length-1)%costumes.length;render()});document.getElementById('next').addEventListener('pointerup',()=>{selected=(selected+1)%costumes.length;render()});wear.addEventListener('pointerup',()=>{costumes.forEach(x=>x.equipped=false);costumes[selected].equipped=true;render()});buy.addEventListener('pointerup',()=>{if(costumes[selected].owned)return;document.getElementById('modalName').textContent=costumes[selected].name;modal.classList.remove('hidden')});document.getElementById('purchase').addEventListener('pointerup',()=>{document.getElementById('sourceTitle').textContent='Dükkân · Zümrüt';});document.getElementById('go').addEventListener('pointerup',()=>{document.getElementById('sourceTitle').textContent='Dükkân · Zümrüt';});document.getElementById('close').addEventListener('pointerup',()=>location.href='../');document.getElementById('modalX').addEventListener('pointerup',()=>modal.classList.add('hidden'));modal.addEventListener('pointerup',event=>{if(event.target===modal)modal.classList.add('hidden')});window.addEventListener('resize',fit);fit();render();
</script></body></html>
